<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wondu — The Hunter Trilogy</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #4db8ff; --accent-deep: #1a6fc4; --accent-pale: #a8d8ff;
    --bg: #03060f; --bg-panel: #070d1a; --bg-raise: #0a1220;
    --border: #2a4a6a; --border-dim: #0d3b6e;
    --text-dim: #5a7fa8;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    color: #ccc;
  }

  body {
    transition: background 0.5s ease;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.025) 2px, rgba(255,255,255,0.025) 4px);
    pointer-events: none; z-index: 9000;
  }

  /* ── ALBUM THEMES ── */
  body[data-album="1"] { --accent:#4db8ff; --accent-deep:#1a6fc4; --accent-pale:#a8d8ff; --bg:#03060f; --bg-panel:#070d1a; --bg-raise:#0c1526; --border:#2a4a6a; --border-dim:#0d3b6e; --text-dim:#5a7fa8; }
  body[data-album="2"] { --accent:#b06dff; --accent-deep:#6b24c4; --accent-pale:#d4aaff; --bg:#05030f; --bg-panel:#0a0714; --bg-raise:#130c22; --border:#3a2060; --border-dim:#2d0a6e; --text-dim:#7a5aa8; }
  body[data-album="3"] { --accent:#4dff8a; --accent-deep:#1a8a40; --accent-pale:#a8ffc4; --bg:#030f05; --bg-panel:#060f08; --bg-raise:#0c1a10; --border:#204030; --border-dim:#0a4020; --text-dim:#5aa870; }
  body[data-album="4"] { --accent:#ffc840; --accent-deep:#c47a00; --accent-pale:#ffe8a0; --bg:#0f0a00; --bg-panel:#140e00; --bg-raise:#221a05; --border:#402800; --border-dim:#5a3a00; --text-dim:#a07830; }
  body[data-album="5"] { --accent:#ff4d4d; --accent-deep:#a30d0d; --accent-pale:#ff9494; --bg:#0f0303; --bg-panel:#140505; --bg-raise:#220808; --border:#601010; --border-dim:#4a0808; --text-dim:#a85a5a; }
  body[data-album="6"] { --accent:#dce6f7; --accent-deep:#8fa3c4; --accent-pale:#ffffff; --bg:#05070a; --bg-panel:#0a0d12; --bg-raise:#141822; --border:#2a3550; --border-dim:#1a2238; --text-dim:#7a8aa8; }
  body[data-album="7"] { --accent:#c9ccd6; --accent-deep:#3a3d42; --accent-pale:#eef0f4; --bg:#050505; --bg-panel:#0a0a0a; --bg-raise:#121212; --border:#2a2a2a; --border-dim:#1a1a1a; --text-dim:#6a6a6a; }

  /* ── APP SHELL ── */
  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    position: relative; z-index: 1;
  }

  body[data-album="1"] .topbar, body[data-album="1"] .sidebar { background: rgba(7,13,26,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body[data-album="2"] .topbar, body[data-album="2"] .sidebar { background: rgba(10,7,20,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body[data-album="3"] .topbar, body[data-album="3"] .sidebar { background: rgba(6,15,8,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body[data-album="4"] .topbar, body[data-album="4"] .sidebar { background: rgba(20,14,0,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body[data-album="5"] .topbar, body[data-album="5"] .sidebar { background: rgba(20,5,5,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body[data-album="6"] .topbar, body[data-album="6"] .sidebar { background: rgba(10,13,18,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body[data-album="7"] .topbar, body[data-album="7"] .sidebar { background: rgba(5,5,5,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.4rem; border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
    transition: border-color 0.5s ease, background 0.5s ease;
    z-index: 10; position: relative;
  }
  .topbar-brand { display: flex; align-items: baseline; gap: 0.8rem; }
  .topbar-title { font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.3em; font-size:1rem; text-transform:uppercase; color:#eee; }

  /* ── LOADING SCREEN ── */
  .loading-screen {
    position: fixed; inset: 0; z-index: 99999;
    background: #030507;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0.8rem;
    transition: opacity 0.6s ease;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; }
  .loading-mark {
    font-size: 2.2rem; color: #4db8ff;
    animation: loadingSpin 2.4s linear infinite;
  }
  @keyframes loadingSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .loading-title {
    font-family: 'Share Tech Mono', monospace;
    color: #eee; font-size: 0.85rem; letter-spacing: 0.4em; text-transform: uppercase;
  }
  .loading-sub {
    font-family: 'Share Tech Mono', monospace;
    color: #556; font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase;
  }
  .loading-bar {
    width: 220px; height: 2px; background: #1a1f28; margin-top: 0.4rem; overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%; width: 0%; background: #4db8ff;
    transition: width 0.25s ease;
  }
  .topbar-sub { font-size:0.58rem; letter-spacing:0.2em; color: var(--text-dim); text-transform:uppercase; transition: color 0.5s ease; }
  .topbar-stamp { font-size:0.55rem; letter-spacing:0.2em; color: var(--accent); text-transform:uppercase; transition: color 0.5s ease; }
  @media (min-width: 981px) {
    .topbar-stamp {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }
  }

  .fullscreen-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    width: 1.9rem; height: 1.9rem; flex-shrink: 0; cursor: pointer;
    font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .fullscreen-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg-raise); }

  .app-main {
    display: grid;
    grid-template-columns: 300px 2.4rem minmax(0,1.15fr) 2.8rem minmax(0,1fr);
    min-height: 0;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    min-height: 0;
    transition: border-color 0.5s ease, background 0.5s ease;
  }

  .album-tabs {
    display: flex; flex-direction: column; gap: 0.55rem;
    padding: 0.8rem; border-bottom: 1px solid var(--border);
    transition: border-color 0.5s ease;
  }
  .album-tab {
    font-family:'Rajdhani',sans-serif; border: 1px solid #333; color: #999; cursor: pointer;
    transition: all 0.2s; position: relative; display: flex; align-items: center; gap: 0.7rem;
    padding: 0.5rem 0.6rem; text-align: left; background: var(--bg-raise);
  }
  .album-tab .tab-thumb {
    width: 3.6rem; height: 3.6rem; flex-shrink: 0; background: var(--bg);
    border: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .album-tab .tab-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .album-tab .tab-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .album-tab .num { font-size: 0.55rem; font-weight: bold; letter-spacing: 0.2em; color: var(--text-dim); transition: color 0.5s ease; }
  .album-tab .title-text { font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; visibility: visible; display: block; }
  .album-tab:hover { border-color: #888; }
  .album-tab:hover .title-text { color: #fff; }
  .album-tab.active-1, .album-tab.active-2, .album-tab.active-3 { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .album-tab.active-1 .tab-thumb, .album-tab.active-2 .tab-thumb, .album-tab.active-3 .tab-thumb { border-color: var(--accent-deep); }
  .album-tab.active-1 .num, .album-tab.active-2 .num, .album-tab.active-3 .num { color: var(--accent-pale); }
  .album-tab.active-1 .title-text, .album-tab.active-2 .title-text, .album-tab.active-3 .title-text { color: #fff; }

  .track-nav {
    flex: 1; overflow-y: auto; padding: 0.4rem;
  }
  .track-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.55rem 0.6rem; cursor: pointer; user-select: none;
    border-left: 2px solid transparent; transition: all 0.15s;
    border-radius: 2px;
  }
  .track-row:hover { background: var(--bg-raise); }
  .track-row.active { background: var(--bg-raise); border-left-color: var(--accent); }
  .track-row .t-num { font-size: 0.58rem; color: var(--accent-deep); min-width: 1.6rem; transition: color 0.5s ease; }
  .track-row .t-title {
    font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.06em;
    font-size: 0.82rem; text-transform: uppercase; color: #99a; flex:1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .track-row.active .t-title { color: var(--accent-pale); }
  .track-row .t-inst { font-size: 0.5rem; color: var(--text-dim); letter-spacing: 0.1em; transition: color 0.5s ease; }
  .chapter-divider {
    display: flex; align-items: baseline; gap: 0.5rem;
    padding: 0.7rem 0.6rem 0.25rem; margin-top: 0.3rem;
  }
  .chapter-divider:first-child { margin-top: 0; }
  .chapter-roman { font-size: 0.6rem; color: var(--accent-deep); letter-spacing: 0.1em; }
  .chapter-name {
    font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.15em;
    font-size: 0.68rem; text-transform: uppercase; color: var(--text-dim);
  }

  .cover-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.65rem 0.6rem; margin-bottom: 0.5rem; cursor: pointer; user-select: none;
    border: 1px solid var(--border); border-left: 2px solid var(--border-dim);
    transition: all 0.15s;
  }
  .cover-row:hover { background: var(--bg-raise); border-color: var(--accent-deep); }
  .cover-row.active { background: var(--bg-raise); border-left-color: var(--accent); border-color: var(--accent-deep); }
  .cover-row .c-icon { font-size: 0.85rem; color: var(--accent); transition: color 0.5s ease; }
  .cover-row .c-label { font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.15em; font-size: 0.78rem; text-transform: uppercase; color: #ccd; }
  .cover-row.active .c-label { color: var(--accent-pale); }
  .track-nav-divider { height: 1px; background: var(--border); opacity: 0.6; margin: 0 0.6rem 0.5rem; transition: background 0.5s ease; }

  .sidebar-foot {
    padding: 0.6rem 1rem; font-size: 0.52rem; letter-spacing: 0.15em;
    color: #333; border-top: 1px solid var(--border); text-transform: uppercase;
    transition: border-color 0.5s ease;
  }
  @media (max-width: 980px) {
    .sidebar-foot { display: none; }
  }

  /* ── PLAY BUTTONS & NOW-PLAYING STATE ── */
  .row-play-btn {
    flex-shrink: 0; width: 1.5rem; height: 1.5rem; border-radius: 50%;
    border: 1px solid var(--border-dim); background: transparent; color: var(--text-dim);
    font-size: 0.55rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .row-play-btn:hover { border-color: var(--accent); color: var(--accent); }
  .track-row.playing, .ao-track-item.playing { background: var(--bg-raise); }
  .track-row.playing .row-play-btn, .ao-track-item.playing .row-play-btn { border-color: var(--accent); color: var(--accent); background: var(--bg); }
  .track-row.playing .t-title, .ao-track-item.playing .aot-title { color: var(--accent-pale); }

  .th-play-btn { color: var(--accent); border-color: var(--border-dim); }
  .th-play-btn:hover:not(:disabled) { border-color: var(--accent); }

  /* ── MINI PLAYER ── */
  .mini-player {
    display: none; align-items: center; gap: 1rem;
    padding: 0.55rem 1.4rem;
    background: var(--bg-panel); border-top: 1px solid var(--border);
    transition: border-color 0.5s ease, background 0.5s ease;
  }
  .mini-player.active { display: flex; animation: miniPlayerIn 0.4s cubic-bezier(.4,0,.2,1); }
  @keyframes miniPlayerIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .mp-btn, .row-play-btn, .text-nav-btn, .mobile-tab-btn, .album-tab, .cover-row, .track-row, .ao-track-item { transition: transform 0.15s ease, background 0.15s ease, border-color 0.2s ease, color 0.2s ease; }
  .mp-btn:active, .row-play-btn:active, .text-nav-btn:active, .th-play-btn:active { transform: scale(0.88); }
  .mobile-tab-btn:active { transform: scale(0.94); }
  /* ── PURE CSS TRANSPORT ICONS (no emoji/unicode glyphs, renders identically everywhere) ── */
  .icon { display: inline-block; position: relative; }
  .icon-tri-right { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid currentColor; }
  .icon-tri-left { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 8px solid currentColor; }
  .icon-pause { width: 8px; height: 10px; }
  .icon-pause::before, .icon-pause::after { content: ''; position: absolute; top: 0; width: 3px; height: 10px; background: currentColor; }
  .icon-pause::before { left: 0; }
  .icon-pause::after { left: 5px; }

  .mp-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    width: 2rem; height: 2rem; border-radius: 50%; flex-shrink: 0;
    cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .mp-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mp-play { width: 2.3rem; height: 2.3rem; font-size: 0.8rem; }
  .mp-info { min-width: 0; flex: 1 1 auto; max-width: 240px; overflow: hidden; }
  .mp-title { font-family:'Rajdhani',sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-album { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.5s ease; }
  .mp-progress {
    flex: 1; min-width: 0; height: 3px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; cursor: pointer; outline: none;
    transition: background 0.5s ease;
  }
  .mp-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .mp-progress::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .mp-time { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 0.05em; white-space: nowrap; flex-shrink: 0; transition: color 0.5s ease; }

  .mp-volume { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .mp-vol-btn { font-size: 0.85rem; }
  .mp-vol-slider {
    width: 70px; height: 3px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; cursor: pointer; outline: none;
    transition: background 0.5s ease;
  }
  .mp-vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .mp-vol-slider::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }

  @media (max-width: 700px) {
    .mp-info { max-width: 100px; }
    .mp-time { display: none; }
    .mp-vol-slider { width: 46px; }
  }

  /* ── COVER PANE ── */
  .cover-pane {
    position: relative; overflow: hidden;
    border-right: 1px solid var(--border);
    transition: border-color 0.5s ease;
    display: flex; align-items: stretch; justify-content: stretch;
    grid-column: 3;
  }
  .cover-pane.panel-collapsed { border-right-color: transparent; }
  .cover-img-wrap { position: absolute; inset: 0; }
  .cover-glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 60%, var(--accent) 0%, transparent 65%);
    opacity: 0.18;
    transition: background 0.6s ease;
  }
  .cover-glow.pulsing { animation: coverGlowPulse 2.2s ease-in-out infinite; }
  @keyframes coverGlowPulse { 0%, 100% { opacity: 0.14; } 50% { opacity: 0.42; } }
  .cover-img {
    width: 100%; height: 100%; object-fit: cover;
    opacity: 0.92; transition: opacity 0.4s ease;
  }
  .cover-img.swap { opacity: 0; }
  .cover-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-raise) 0%, var(--bg) 80%);
  }
  .cover-fallback svg { width: 100%; height: 100%; display: block; }
  .cover-fallback .placeholder-caption {
    position: absolute; bottom: 0.7rem; right: 0.9rem; z-index: 3;
    font-size: 0.5rem; letter-spacing: 0.15em; color: var(--text-dim); opacity: 0.6;
    text-transform: uppercase; transition: color 0.5s ease; pointer-events: none;
  }
  .cover-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 30%, rgba(0,0,0,0.05) 55%, rgba(0,0,0,0.35) 100%);
  }
  .cover-content {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    justify-content: space-between; width: 100%; padding: 1.6rem 2rem;
    flex: 1;
  }
  .cover-top { display:flex; justify-content: space-between; font-size: 0.58rem; letter-spacing: 0.15em; color: rgba(255,255,255,0.55); text-transform: uppercase; }
  .cover-bottom { }
  .cover-eyebrow { font-size: 0.62rem; letter-spacing: 0.35em; color: var(--accent); text-transform: uppercase; margin-bottom:0.5rem; transition: color 0.5s ease; }
  .cover-echo-badge {
    display: none; font-size: 0.58rem; letter-spacing: 0.15em; color: var(--accent-deep);
    text-transform: uppercase; margin-bottom: 0.6rem; font-family:'Share Tech Mono', monospace;
  }
  .cover-bottom { animation: fadeInLeft 0.35s ease both; }
  .cover-title {
    font-family:'Rajdhani',sans-serif; font-size: clamp(2rem, 4vw, 3.4rem); font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: #fff; line-height: 1.05;
    text-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  .cover-tagline { font-size: 0.8rem; font-style: italic; color: #ddd; margin-top: 0.6rem; max-width: 480px; }
  .cover-meta { display:flex; flex-wrap: wrap; gap: 1.4rem; margin-top: 1.1rem; font-size: 0.58rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
  .cover-song-note { display: none; font-size: 0.85rem; font-style: italic; color: rgba(255,255,255,0.78); line-height: 1.75; max-width: 560px; margin-top: 0.6rem; }
  .cover-meta span { color: var(--accent); transition: color 0.5s ease; }
  .cover-pulse { width: 100%; height: 34px; margin-top: 0.9rem; display:block; }

  /* ── COVER ANIMATION CLIP (plays inline inside the artwork frame) ── */
  .cover-clip-btn {
    position: absolute; right: 1rem; bottom: 1rem; z-index: 6;
    width: 2.4rem; height: 2.4rem; border-radius: 50%;
    background: rgba(40,0,0,0.6); border: 1px solid #ff3b3b;
    color: #ff5c5c; font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .cover-clip-btn:hover { background: rgba(80,0,0,0.85); border-color: #ff6b6b; color: #ff8080; transform: scale(1.06); }
  .cover-pane.track-selected .cover-clip-btn { display: none; }

  .clip-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: none; background: #000; z-index: 3;
  }
  .clip-video.active { display: block; }

  @media (max-width: 980px) {
    .clip-video { object-fit: contain; }
  }

  /* ── TEXT PANE ── */
  .text-pane {
    display: flex; flex-direction: column; min-height: 0;
    position: relative;
    grid-column: 5;
  }
  .text-pane-inner {
    display: flex; flex-direction: column; min-height: 0; flex: 1;
    background: var(--bg); transition: background 0.5s ease, transform 0.45s ease, opacity 0.4s ease;
  }
  @media (min-width: 981px) {
    .text-pane-inner.collapsed { transform: translateX(-100%); opacity: 0; pointer-events: none; }
  }
  .text-pane-toggle {

        "note": "The Hunter awakens beneath a foreign sky and discovers that roughly a thousand years have passed. The wilderness and world he knew have been replaced by immense towers, concrete and a technologically advanced civilization. The same Mark he carries is displayed throughout the city, and strangers appear to know his face and name. He has become a legend while being absent from history. A banner bearing his own symbol hangs from a tower a hundred feet tall above the gates.",

            "text": "When the empire falls\nLet it fall\nLet it fall\n\nWhen the empire calls\nWe won't answer anymore\n\nYou took everything\nNow you have nothing\n\nHere we stand\nAnd watch it fall\n\nWhen the empire falls\nLet it fall\nLet it fall\n\nA thousand years\nTo build these walls\n\nOne night\n\nTo lose it all"
          }
        ]
      },
      {
        "title": "The Wild Remains",
        "image": "Album 2 - Legacy of the Mark/11-the-wild-remains.png",
        "audio": "Album 2 - Legacy of the Mark/The Wild Remains.mp3",
        "note": "Morning arrives without machines filling the sky. In the silence, The Hunter notices green life pushing through cracks in the city. Nature survived beneath the empire and begins reclaiming the ground as soon as control disappears. The Hunter accepts that he, too, has survived change.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Morning comes without the lights\nNo machines across the sky\nFor the first time since I came\nI can hear the falling rain\n\nThrough the cracks beneath my feet\nSomething reaches through the street\nSmall and green against the grey\nSomething they couldn't take away"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "All this time\nUnderneath\nIt was waiting\nTo be free"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "The wild remains\nThe wild remains\nYou can bury it\nBut it won't stay down\n\nThe wild remains\nAfter everything\nGive it time\nIt will take back the ground"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Roots are breaking through the stone\nGrowing where they don't belong\nThrough the towers, through the roads\nLife returns to what was cold\n\nI remember somewhere green\nAlmost like it came from dreams\nFor a moment I can see\nThe world that used to carry me"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "All this time\nUnderneath\nIt was waiting\nTo be free"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "The wild remains\nThe wild remains\nYou can bury it\nBut it won't stay down\n\nThe wild remains\nAfter everything\nGive it time\nIt will take back the ground"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "No more orders\nNo alarms\nNo more numbers\nOn their arms\n\nNo more towers\nBlocking out the sun\n\nFor the first time\nIn a thousand years\n\nThe old world\nHas begun"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "The wild remains\nThe wild remains\nYou can bury it\nBut it won't stay down\n\nThe wild remains\nAfter everything\nNow I see it\nBreaking through the ground\n\nThe wild remains\nAnd so do I\nDifferent world\nUnder the same sky\n\nA thousand years\nCouldn't end this place\n\nEverything changes\n\nBut the wild remains"
          }
        ]
      }
    ],

  "3": {
    "roman": "III",
    "title": "Where Worlds End",
    "cover": "Album 3 - Where Worlds End/00-where-worlds-end-cover.png",
    "intro": "The final album expands the conflict from civilizations to worlds. The Hunter learns that the Mark is a key between realms, discovers previous bearers, confronts the force that consumed them, unites surviving worlds for a final war and ultimately ends the cycle by destroying the Mark itself.",
    "label": "// Album III of III \u2014 The Hunter Trilogy //",
    "tagline": "\"Some things end so life can grow.\"",
    "meta": [
      [
        "GENRE",
        "Epic / Cosmic Metal"
      ],
      [
        "TRACKS",
        "11"
      ],
      [
        "SETTING",
        "Beyond the Stars"
      ]
    ],
    "tracks": [
      {
        "title": "Dead Signal",
        "image": "Album 3 - Where Worlds End/01-dead-signal.png",
        "audio": "Album 3 - Where Worlds End/Dead Signal.mp3",
        "note": "In the aftermath of the empire's fall, the city begins learning how to live without constant control. The Hunter briefly believes his journey may finally be over. Then dead screens reactivate without any surviving command network, his Mark burns again, and an impossible signal arrives from far beyond the known world. A voice cuts through the transmission: 'We found you.'",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Morning breaks across the grey\nSmoke is slowly blown away\nNo more orders, no machines\nJust the sound of something free\n\nPeople walking through the rain\nLearning how to live again\nFor a moment I believe\nMaybe I can finally leave"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "Then the sky\nStarts to change\nOne red light\nFar away"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "There's a dead signal\nCalling out my name\nA dead signal\nFrom a world away\n\nI thought it ended\nI thought I was free\nBut that dead signal\nIs calling me"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Every screen begins to glow\nOne by one, row by row\nNo command and no control\nJust a sound from somewhere cold\n\nThen the mark upon my skin\nBurns like it did back then\nI remember that old call\nBefore I ever knew at all"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "In the sky\nSomething burns\nAfter all\nIt has returned"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "There's a dead signal\nCalling out my name\nA dead signal\nFrom a world away\n\nI thought it ended\nI thought I was free\nBut that dead signal\nIs calling me"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "Not again\nNot this time\nI've been yours\nAll my life\n\nTell me where\nTell me why\nWhat the hell\nIs in that sky?"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "There's a dead signal\nCalling out my name\nA dead signal\nFrom a world away\n\nI thought it ended\nI thought I was free\nBut that dead signal\nIs calling me\n\nThere's a dead signal\nBurning through the sky\nA dead signal\nAnd I don't know why\n\nThen one voice\nCuts through the air\u2014\n\n\"We found you.\""
          }
        ]
      },
      {
        "title": "From Beyond",
        "image": "Album 3 - Where Worlds End/02-from-beyond.png",
        "audio": "Album 3 - Where Worlds End/From Beyond.mp3",
        "note": "The signal becomes an incursion. Something crosses into The Hunter's world from outside the known realms, and the recovering city is forced into immediate defense. Former enemies stand together because the threat does not distinguish between factions. The danger is no longer a single realm or empire, but something approaching from beyond all of them.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Black sun hanging overhead\nAll the city glowing red\nEvery signal, every screen\nShows a place I've never seen\nSomething moving past the light\nComing closer through the night\nThen the ground begins to shake\nAnd the heavens start to break"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "Hear the sound\nFeel it grow\nSomething's coming\nFrom below"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "From beyond\nThey are calling\nFrom beyond\nI hear them now\nThrough the dark\nThrough the silence\nFrom beyond\nThey're coming down"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Fire falling from the sky\nPeople running for their lives\nShapes are forming in the clouds\nThen the first one touches down\nSteel and stone begin to burn\nNow the whole damn city turns\nEvery soldier takes their place\nWaiting for what comes our way"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "Hear the sound\nFeel it grow\nNow we know\nWe're not alone"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "From beyond\nThey are calling\nFrom beyond\nI hear them now\nThrough the dark\nThrough the silence\nFrom beyond\nThey're coming down\n\nFrom beyond\nLet them find me\nI've been running long enough\nIf they came\nTo take this world\nThen they're coming through us"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "Raise the walls\nSound the call\nYesterday\nWe watched them fall\nNow the ones\nI came to fight\nStand with me\nHere tonight"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "From beyond\nThey are calling\nFrom beyond\nWe hear them now\nThrough the dark\nThrough the silence\nFrom beyond\nThey're coming down\n\nFrom beyond\nLet them find us\nWe have nowhere left to run\nIf they came\nTo take this world\nThen let them fucking come\n\nFrom beyond\nFrom beyond\n<strong>LET THEM COME</strong>"
          }
        ]
      },
      {
        "title": "Black Horizon",
        "image": "Album 3 - Where Worlds End/03-black-horizon.png",
        "audio": "Album 3 - Where Worlds End/Black Horizon.mp3",
        "note": "The invading force withdraws through a vast rupture in the sky. The Hunter realizes the Mark recognizes the passage and chooses to follow. He crosses beyond his world into a region where broken worlds, ancient structures and impossible distances hang in darkness. On a distant world, carved into a tower drifting in the wreckage, he sees the same Mark.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Fire burns across the ground\nBroken ships are falling down\nWhat came through is pulling back\nDisappearing into black\nThere's a doorway in the sky\nWide enough to swallow light\nAnd the mark begins to burn\nLike it knows where they return"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "One way in\nNo way back\nOne more road\nInto the black"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "Black horizon\nOpen wide\nThere's another world\nOn the other side\nBlack horizon\nTake me through\nIf you're calling me\nI'm coming for you"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Leave the towers far behind\nCross the edge and lose the light\nNo more ground beneath my feet\nNothing here looks real to me\nWorlds are hanging in the dark\nBroken pieces, burning stars\nAncient ruins drift alone\nOlder than the world I know"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "No way down\nNo way back\nOnly forward\nThrough the black"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "Black horizon\nOpen wide\nThere's another world\nOn the other side\nBlack horizon\nTake me through\nIf you're calling me\nI'm coming for you\n\nBlack horizon\nHere I stand\nTake me further\nThan I've ever been\nI don't know\nWhat waits inside\nBut I'm crossing\nThe other side"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "World after world\nEnd after end\nHow far does this go?\nName after name\nGone without trace\nHow many came before?\nThen I see\nAcross the dark\nAnother world\n<strong>With my mark</strong>"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "Black horizon\nNow I see\nThere's something here\nThat remembers me\nBlack horizon\nWorlds collide\nA thousand fires\nBurning side by side\nBlack horizon\nNo turning back\nI've come too far\nTo fear the black\nWhatever waits\nBeyond that light\n<strong>I'm coming through\nTo find out why</strong>\n<strong>I'm coming through\nTo find out why</strong>"
          }
        ]
      },
      {
        "title": "No Stars Here",
        "image": "Album 3 - Where Worlds End/04-no-stars-here.png",
        "audio": "Album 3 - Where Worlds End/No Stars Here.mp3",
        "note": "The Hunter travels among dead and shattered worlds. There are no familiar stars or natural sky, only the remains of civilizations that have already been destroyed. The Mark appears repeatedly in their ruins. A single word, scratched into stone by someone who didn't survive long enough to write more, confirms that a force moves from world to world and eventually comes for everything.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "No sun rising in the east\nNo moon hanging over me\nOnly worlds across the black\nSome are whole and some are cracked\n\nNo wind moving through this place\nNo direction, time or day\nI look up but nothing's clear\nThere are no stars here"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "Where am I?\nWhat is this?\nHow many worlds\nEnd like this?"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "There are no stars here\nNo light above\nNothing to guide me\nNothing I know\n\nThere are no stars here\nJust worlds in the dark\nSomething came through them\nAnd tore them apart"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Cities broken clean in two\nEmpty roads still running through\nShips lie buried in the stone\nEvery world has been left cold\n\nThen I find it on a wall\nSame damn mark above them all\nCut into the blackened stone\nFar away from home"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "Who was here?\nWho survived?\nWho left the mark\nBefore they died?"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "There are no stars here\nNo light above\nNothing to guide me\nNothing I know\n\nThere are no stars here\nJust worlds in the dark\nSomething came through them\nAnd tore them apart"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "One world\nThen another\nOne grave\nThen another\n\nSame mark\nEvery time\nSame warning\nEvery line"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "There are no stars here\nNow I know why\nSomething is moving\nOutside of the light\n\nThere are no stars here\nJust worlds left behind\nWhatever destroyed them\nIs coming for mine\n\nCut in the stone\nOne final word\u2014\n\n<strong>\"RUN.\"</strong>"
          }
        ]
      },
      {
        "title": "The Others",
        "image": "Album 3 - Where Worlds End/05-the-others.png",
        "audio": "Album 3 - Where Worlds End/The Others.mp3",
        "note": "The Hunter finds a memorial containing images and weapons of other Mark-bearers from different worlds and ages. Some were rulers, some slaves, some warriors, but all were called across the boundaries between worlds. None returned. The Hunter understands that he is neither the first nor the only one.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Figures carved into the stone\nStanding there in rows alone\nDifferent faces, different names\nEvery one who came this way\n\nEvery weapon, every scar\nEvery world beneath a mark\nThen I see above their hands\nThe same damn sign I understand"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "One by one\nSide by side\nThey were here\nBefore they died"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "There were others\nJust like me\nThere were others\nI can see\n\nDifferent worlds\nDifferent wars\nSame old mark\nThat we all wore"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Some were kings and some were slaves\nSome were young and some were grey\nEvery carving tells the same\nThey were called and then they came\n\nThrough the dark and through the gate\nEvery one was brought this way\nNow their weapons line the wall\nBut no one came back at all"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "One by one\nSide by side\nThey came here\nAnd here they died"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "There were others\nJust like me\nThere were others\nI can see\n\nDifferent worlds\nDifferent wars\nSame old mark\nThat we all wore"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "Not the first\nNot alone\nNot the only\nOne they chose\n\nEvery road\nEvery sign\nBrought them here\nJust like mine"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "There were others\nJust like me\nThere were others\nNow I see\n\nDifferent worlds\nDifferent wars\nSame old mark\nThat we all wore\n\nThey came before\nThey crossed the line\n\n<strong>Now I'm the last\nOne left alive</strong>"
          }
        ]
      },
      {
        "title": "World Eater",
        "image": "Album 3 - Where Worlds End/06-world-eater.png",
        "audio": "Album 3 - Where Worlds End/World Eater.mp3",
        "note": "The force responsible for the dead worlds finally appears. It is vast enough to consume or erase entire realms and is drawn specifically to the Mark. The Hunter sees why the previous bearers died. When the World Eater turns toward him, the same force that destroyed countless worlds now has a path toward his.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Something moves behind the dark\nBig enough to hide the stars\nI can feel it drawing near\nNow I know what happened here\n\nBroken worlds begin to shake\nPieces pulling in its wake\nEverything it passes through\nDisappears without a trace"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "Now I know\nNow I see\nWhat was waiting\nHere for me"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "World eater\nHere it comes\nWorld eater\nBlot the sun\n\nTake the sky\nTake the ground\nWorld eater\nTear it down"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Armies rise across the stone\nWeapons fire into the void\nEvery shot is swallowed whole\nNothing seems to slow it down\n\nThen the mark begins to burn\nAnd the creature starts to turn\nAll that darkness shifts to me\nLike I'm all it came to see"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "Now I know\nWhy they died\nIt was waiting\nAll this time"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "World eater\nHere it comes\nWorld eater\nBlot the sun\n\nTake the sky\nTake the ground\nWorld eater\nTear it down"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "It sees the mark\nIt knows the sign\nIt killed the others\nNow it wants mine\n\nCome and take it\nCome and try\nI've watched two worlds\nRefuse to die"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "World eater\nLook at me\nWorld eater\nNow I see\n\nYou took them all\nOne by one\nBut this time\nI won't run\n\nWorld eater\nHear me now\n\n<strong>YOU WANT MY WORLD?\nCOME TAKE IT DOWN</strong>"
          }
        ]
      },
      {
        "title": "Open the Gate",
        "image": "Album 3 - Where Worlds End/07-open-the-gate.png",
        "audio": "Album 3 - Where Worlds End/Open the Gate.mp3",
        "note": "The Hunter discovers the true function of the Mark. It was never merely a warrior's symbol or biological anomaly: it is a key capable of opening passages between realms. Every crossing in his past potentially created a route that other forces could exploit. His greatest gift has also been the mechanism through which danger followed him.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Words are written in the stone\nOlder than the worlds I know\nEvery line begins to show\nWhy the others had to go\n\nEvery mark became a door\nEvery door became a war\nThey were never called to fight\nThey were made to turn the lock"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "All this time\nI wore the sign\nNever knew\nWhat lived inside"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "Open the gate\nOpen the way\nOne world falls\nAnother remains\n\nOpen the gate\nNow I understand\nThe key was never\nIn my hand"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "It was carried in my blood\nLong before I knew what was\nEvery time I crossed a line\nSomething crossed behind\n\nThat's how he came through with me\nThat's what I could never see\nEvery door I opened wide\nLet another thing inside"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "All this time\nI blamed the world\nNow I know\nWhat I have done"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "Open the gate\nOpen the way\nOne world falls\nAnother remains\n\nOpen the gate\nNow I understand\nThe key was never\nIn my hand"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "Not a crown\nNot a name\nNot a gift\nNot a chain\n\nIt's a key\nIt's a door\nAnd I won't\nUse it anymore"
          },
          {
            "label": "FINAL CHORUS",
            "type": "final-chorus",
            "text": "Open the gate\nOpen the way\nThat's what they wanted\nThat's why they came\n\nOpen the gate\nNow I understand\nThe key was never\nIn my hand\n\nIt was the mark\nUnder my skin\n\n<strong>I OPENED THE DOOR\nAND LET THEM IN</strong>"
          }
        ]
      },
      {
        "title": "No Way Back",
        "image": "Album 3 - Where Worlds End/08-no-way-back.png",
        "audio": "Album 3 - Where Worlds End/No Way Back.mp3",
        "note": "The Hunter refuses to remain trapped in guilt. He deliberately uses the Mark to pursue the enemy deeper into its territory, then seals the route behind himself so the threat cannot simply follow him home. For the first time, he is using the Mark with full knowledge of what it does.",
        "sections": [
          {
            "label": "VERSE 1",
            "type": "verse",
            "text": "Every road I ever crossed\nEvery world and every loss\nEvery door I opened wide\nLeft a way to get inside\n\nI can stand and curse the past\nI can wish I knew the facts\nBut the ones who came before\nNever made it through that door"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "No more doubt\nNo more fear\nIf it wants me\nI am here"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "No way back\nNo way home\nI go further\nOn my own\n\nNo way back\nLet it close\nWhere this ends\nNobody knows"
          },
          {
            "label": "VERSE 2",
            "type": "verse",
            "text": "Leave the broken worlds behind\nFollow where the darkness hides\nEvery step it pulls away\nLike it wants me in this place\n\nIf the mark can lead me through\nThen I'll make it useful too\nOne last door and one last road\nTake me where I need to go"
          },
          {
            "label": "PRE-CHORUS",
            "type": "chorus",
            "text": "No more doubt\nNo more fear\nIf it wants me\nI am here"
          },
          {
            "label": "CHORUS",
            "type": "chorus",
            "text": "No way back\nNo way home\nI go further\nOn my own\n\nNo way back\nLet it close\nWhere this ends\nNobody knows"
          },
          {
            "label": "BRIDGE",
            "type": "bridge",
            "text": "Close the door\nBehind my back\nCut the road\nSeal the path\n\nIf I fall\nLet me fall\nAt least it ends\nHere with us"
          },
          {

// ── STATE ──
// track: -1 means "showing the album cover", 0..N-1 are actual tracks
// ── ALBUM RANGE (computed so this scales cleanly if more albums are ever merged in) ──
const ALBUM_NUMS = Object.keys(ALBUMS).map(Number);
const MIN_ALBUM = Math.min(...ALBUM_NUMS);
const MAX_ALBUM = Math.max(...ALBUM_NUMS);

let state = { album: MIN_ALBUM, track: -1 };

// ── PULSE CANVAS ──
let pulseCtx = null, pulseT = 0, pulseAnim = null;
function initPulseCanvas() {
  const canvas = document.getElementById('coverPulse');
  if (!canvas) return;
  pulseCtx = canvas.getContext('2d');
  function resize() {
    canvas.width = canvas.offsetWidth * window.devicePixelRatio;
    canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    pulseCtx.setTransform(1,0,0,1,0,0);
    pulseCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  function draw() {
    const meta = ALBUMS[state.album];
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    pulseCtx.clearRect(0,0,W,H);

    // Solid backing panel so the readout always reads clearly against any artwork
    pulseCtx.fillStyle = 'rgba(4,10,18,0.72)';
    pulseCtx.fillRect(0, 0, W, H);

    const isPlaying = analyser && audioCtx && audioCtx.state === 'running' && !audioPlayer.paused;
    if (isPlaying) analyser.getByteFrequencyData(freqData);

    const spikeCount = 110;
    const spikeWidth = W / spikeCount;
    const binCount = freqData ? freqData.length : 0;

    pulseCtx.shadowColor = '#eaf6ff';
    pulseCtx.shadowBlur = isPlaying ? 5 : 2;

    for (let i = 0; i < spikeCount / 2; i++) {
      let v;
      if (isPlaying) {
        const bin = Math.floor((i / (spikeCount / 2)) * binCount);
        v = freqData[bin] / 255;
      } else {
        v = 0.08 + 0.1 * (Math.sin(pulseT * 1.4 + i * 0.5) * 0.5 + 0.5)
                 + 0.04 * (Math.sin(pulseT * 0.6 + i * 0.2) * 0.5 + 0.5);
      }
      const spikeH = Math.max(1.5, v * (H * 0.46));
      pulseCtx.fillStyle = i % 3 === 0 ? meta.mid : meta.ice;
      pulseCtx.globalAlpha = isPlaying ? (0.55 + v * 0.5) : 0.4;
      pulseCtx.fillRect(W/2 + i * spikeWidth, H/2 - spikeH, Math.max(1, spikeWidth - 1), spikeH * 2);
      pulseCtx.fillRect(W/2 - (i + 1) * spikeWidth, H/2 - spikeH, Math.max(1, spikeWidth - 1), spikeH * 2);
    }
    pulseCtx.globalAlpha = 1;

    pulseCtx.strokeStyle = meta.mid + '55';
    pulseCtx.lineWidth = 1;
    pulseCtx.shadowBlur = 0;
    pulseCtx.beginPath();
    pulseCtx.moveTo(0, H/2);
    pulseCtx.lineTo(W, H/2);
    pulseCtx.stroke();

    pulseT += 0.03;
    pulseAnim = requestAnimationFrame(draw);
  }
  resize(); window.addEventListener('resize', resize); draw();
}

// ── RENDER: ALBUM TABS ──
function renderAlbumTabs() {
  const el = document.getElementById('albumTabs');
  el.innerHTML = '';
  Object.keys(ALBUMS).forEach(numStr => {
    const num = parseInt(numStr);
    const meta = ALBUMS[num];
    const btn = document.createElement('button');
    btn.className = 'album-tab' + (state.album === num ? ' active-' + num : '');
    btn.innerHTML = `
      <div class="tab-thumb"><img src="${meta.cover}" alt="${meta.title} cover"></div>
      <div class="tab-info">
        <span class="num">ALBUM ${meta.roman}</span>
        <span class="title-text">${meta.title}</span>
      </div>
    `;
    btn.addEventListener('click', () => selectAlbum(num));
    el.appendChild(btn);
  });
}

// ── RENDER: TRACK NAV ──
function renderTrackNav() {
  const el = document.getElementById('trackNav');
  const scrollPos = el.scrollTop;
  el.innerHTML = '';
  const meta = ALBUMS[state.album];

  const coverRow = document.createElement('div');
  coverRow.className = 'cover-row' + (state.track === -1 ? ' active' : '');
  coverRow.innerHTML = `<span class="c-icon">⬢</span><span class="c-label">Album Cover</span>`;
  coverRow.addEventListener('click', () => selectTrack(-1));
  el.appendChild(coverRow);

  const divider = document.createElement('div');
  divider.className = 'track-nav-divider';
  el.appendChild(divider);

  let lastChapter = null;
  meta.tracks.forEach((t, i) => {
    if (t.chapter && t.chapter !== lastChapter) {
      const chapterRow = document.createElement('div');
      chapterRow.className = 'chapter-divider';
      chapterRow.innerHTML = `<span class="chapter-roman">${t.chapterRoman || ''}</span><span class="chapter-name">${t.chapter}</span>`;
      el.appendChild(chapterRow);
      lastChapter = t.chapter;
    } else if (!t.chapter) {
      if (lastChapter !== null) {
        const closeDivider = document.createElement('div');
        closeDivider.className = 'track-nav-divider';
        el.appendChild(closeDivider);
      }
      lastChapter = null;
    }

    const row = document.createElement('div');
    row.className = 'track-row' + (i === state.track ? ' active' : '');
    row.dataset.idx = i;
    const displayTitle = t.title.replace('(Orchestral Echo)', '(OE)');
    row.innerHTML = `
      <button class="row-play-btn" title="Play ${t.title}"><span class="icon icon-tri-right"></span></button>
      <span class="t-num">${String(i+1).padStart(2,'0')}</span>
      <span class="t-title">${displayTitle}</span>
      ${t.instrumental ? '<span class="t-inst">INST</span>' : ''}
    `;
    row.addEventListener('click', () => selectTrack(i));
    row.querySelector('.row-play-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleOrPlay(state.album, i);
    });
    el.appendChild(row);
  });
  el.scrollTop = scrollPos;
  refreshPlayingIndicators();
}

// ── RENDER: COVER PANE ──
function renderCover() {
  const meta = ALBUMS[state.album];
  const track = state.track >= 0 ? meta.tracks[state.track] : null;

  if (typeof stopCoverClip === 'function') stopCoverClip();

  document.querySelector('.cover-pane').classList.toggle('track-selected', !!track);

  const coverBottom = document.querySelector('.cover-bottom');
  if (coverBottom) {
    coverBottom.style.animation = 'none';
    void coverBottom.offsetWidth;
    coverBottom.style.animation = '';
  }

  document.getElementById('coverEyebrow').textContent = meta.label;
  const echoBadge = document.getElementById('coverEchoBadge');
  if (track && track.chapter) {
    echoBadge.textContent = `⬡ CHAPTER ${track.chapterRoman} — ${track.chapter.toUpperCase()} — ECHO ${track.echoIndex} OF ${track.echoTotal} ⬡`;
    echoBadge.style.display = 'block';
  } else {
    echoBadge.textContent = '';
    echoBadge.style.display = 'none';
  }
  document.getElementById('coverTitle').textContent = track ? track.title : meta.title;
  document.getElementById('coverTagline').textContent = meta.tagline;
  document.getElementById('coverSongNote').textContent = track ? (track.note || '') : '';

  const metaEl = document.getElementById('coverMeta');
  metaEl.innerHTML = meta.meta.map(([k,v]) => `<div>${k} <span>${v}</span></div>`).join('');

  const img = document.getElementById('coverImg');
  const fallback = document.getElementById('coverFallback');
  // On the dedicated cover view, always show the true album cover file.
  // On a track view, prefer that track's own illustration, falling back to the album cover.
  const srcToUse = track ? (track.image || meta.cover) : meta.cover;

  // Show themed placeholder art immediately so the pane is never empty,
  // even before we know whether the real file exists.
  fallback.innerHTML = meta.svgFallback + `<div class="placeholder-caption">Drop in ${srcToUse} to replace this artwork</div>`;
  fallback.style.display = 'flex';
  img.style.display = 'none';
  img.classList.add('swap');

  const tmp = new Image();
  tmp.onload = () => {
    img.src = srcToUse;
    img.style.display = 'block';
    fallback.style.display = 'none';
    requestAnimationFrame(() => img.classList.remove('swap'));
  };
  tmp.onerror = () => {
    img.style.display = 'none';
    fallback.style.display = 'flex';
  };
  tmp.src = srcToUse;
}

// ── SELECTION ──
function selectAlbum(num) {
  state.album = num;
  state.track = -1; // land on the album cover first
  document.body.setAttribute('data-album', String(num));
  renderAlbumTabs();
  renderTrackNav();
  renderCover();
  renderText();
}

function selectTrack(i) {
  const meta = ALBUMS[state.album];
  if (i < -1 || i >= meta.tracks.length) return;
  state.track = i;
  renderTrackNav();
  renderCover();
  renderText();
}

function stepTrack(dir) {
  const meta = ALBUMS[state.album];
  let next = state.track + dir;

  if (next < -1) {
    if (state.album > MIN_ALBUM) {
      const prevAlbum = state.album - 1;
      state.album = prevAlbum;
      state.track = ALBUMS[prevAlbum].tracks.length - 1;
      document.body.setAttribute('data-album', String(prevAlbum));
      renderAlbumTabs(); renderTrackNav(); renderCover(); renderText();
    }
    return;
  }
  if (next >= meta.tracks.length) {
    if (state.album < MAX_ALBUM) { selectAlbum(state.album + 1); }
    return;
  }
  selectTrack(next);
}

document.getElementById('prevBtn').addEventListener('click', () => stepTrack(-1));
document.getElementById('nextBtn').addEventListener('click', () => stepTrack(1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') stepTrack(1);
  if (e.key === 'ArrowLeft') stepTrack(-1);
});

// ══════════════════════════════════════════════
// ── AUDIO PLAYER ENGINE ──
// Expects mp3 files named "NN - Track Title.mp3"
// sitting inside each album's own folder: "Album 1/", "Album 2/", etc.
// (matching the same folders the artwork now lives in)
// ══════════════════════════════════════════════
const AUDIO_PATH = ''; // e.g. change if your album folders sit inside a parent subfolder

const audioPlayer = new Audio();
let playingAlbum = null;
let playingIdx = null;
let audioCtx = null;
let analyser = null;
let freqData = null;
let waveData = null;

function ensureAudioAnalyser() {
  if (!analyser) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaElementSource(audioPlayer);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.15;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      waveData = new Uint8Array(analyser.fftSize);
    } catch (e) {
      console.warn('Web Audio visualizer unavailable:', e);
      analyser = null;
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(err => console.warn('AudioContext resume failed:', err));
  }
}

function trackFileName(albumNum, idx) {
  const t = ALBUMS[albumNum].tracks[idx];
  return t.audio || '';
}

function isRowPlaying(albumNum, idx) {
  return playingAlbum === albumNum && playingIdx === idx;
}

// Selects the track (switching album view if needed) AND starts playback.
function playTrackDirect(albumNum, idx) {
  const meta = ALBUMS[albumNum];
  if (idx < 0 || idx >= meta.tracks.length) return;
  if (state.album !== albumNum) {
    state.album = albumNum;
    document.body.setAttribute('data-album', String(albumNum));
    renderAlbumTabs();
  }
  state.track = idx;
  renderTrackNav();
  renderCover();
  renderText();
  loadAndPlay(albumNum, idx);
}

// Same track already loaded → toggle pause/resume. Different track → start it fresh.
function toggleOrPlay(albumNum, idx) {
  if (playingAlbum === albumNum && playingIdx === idx) {
    togglePlayPause();
  } else {
    playTrackDirect(albumNum, idx);
  }
}

function loadAndPlay(albumNum, idx) {
  playingAlbum = albumNum;
  playingIdx = idx;
  const file = trackFileName(albumNum, idx);
  audioPlayer.src = AUDIO_PATH + file;
  ensureAudioAnalyser();
  audioPlayer.play().catch(err => console.warn('Playback failed — check the file exists:', file, err));
  updateMiniPlayer(albumNum, idx);
  refreshPlayingIndicators();
}

function togglePlayPause() {
  if (!audioPlayer.src) return;
  if (audioPlayer.paused) {
    ensureAudioAnalyser();
    audioPlayer.play().catch(err => {
      console.warn('Resume failed, retrying after reload:', err);
      const t = audioPlayer.currentTime;
      audioPlayer.load();
      audioPlayer.currentTime = t;
      audioPlayer.play().catch(err2 => console.error('Retry also failed:', err2));
    });
  } else {
    audioPlayer.pause();
  }
}

audioPlayer.addEventListener('error', () => {
  const err = audioPlayer.error;
  let msg = 'Unknown playback error';
  if (err) {
    switch (err.code) {
      case err.MEDIA_ERR_ABORTED: msg = 'Playback aborted'; break;
      case err.MEDIA_ERR_NETWORK: msg = 'Network error while loading audio'; break;
      case err.MEDIA_ERR_DECODE: msg = 'File could not be decoded (corrupt or unsupported encoding)'; break;
      case err.MEDIA_ERR_SRC_NOT_SUPPORTED: msg = 'File not found or format not supported'; break;
    }
  }
  console.error('Audio error on', audioPlayer.src, '—', msg);
});

// Autoplay: rolls from track to track, then album to album (I → II → III → IV).
function playNextGlobal() {
  if (playingAlbum === null) return;
  const meta = ALBUMS[playingAlbum];
  if (playingIdx + 1 < meta.tracks.length) {
    playTrackDirect(playingAlbum, playingIdx + 1);
  } else if (playingAlbum < MAX_ALBUM) {
    playTrackDirect(playingAlbum + 1, 0);
  }
}

function playPrevGlobal() {
  if (playingAlbum === null) return;
  if (playingIdx - 1 >= 0) {
    playTrackDirect(playingAlbum, playingIdx - 1);
  } else if (playingAlbum > MIN_ALBUM) {
    const prevMeta = ALBUMS[playingAlbum - 1];
    playTrackDirect(playingAlbum - 1, prevMeta.tracks.length - 1);
  }
}

function updateMiniPlayer(albumNum, idx) {
  const meta = ALBUMS[albumNum];
  const t = meta.tracks[idx];
  document.getElementById('mpTitle').textContent = t.title;
  document.getElementById('mpAlbum').textContent = meta.title.toUpperCase() + ' — TRACK ' + String(idx+1).padStart(2,'0');
  document.getElementById('miniPlayer').classList.add('active');
}

function refreshPlayingIndicators() {
  document.querySelectorAll('.track-row, .ao-track-item').forEach(row => {
    const idx = parseInt(row.dataset.idx, 10);
    const btn = row.querySelector('.row-play-btn');
    const isThis = isRowPlaying(state.album, idx);
    const nowPlaying = isThis && !audioPlayer.paused;
    row.classList.toggle('playing', nowPlaying);
    if (btn) btn.innerHTML = `<span class="icon ${nowPlaying ? 'icon-pause' : 'icon-tri-right'}"></span>`;
    if (nowPlaying) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  const mainBtn = document.getElementById('thPlayBtn');
  if (mainBtn && !mainBtn.disabled) {
    const isThis = isRowPlaying(state.album, state.track);
    mainBtn.innerHTML = `<span class="icon ${(isThis && !audioPlayer.paused) ? 'icon-pause' : 'icon-tri-right'}"></span>`;
  }
  const mpBtn = document.getElementById('mpPlayPause');
  if (mpBtn) mpBtn.innerHTML = `<span class="icon ${audioPlayer.paused ? 'icon-tri-right' : 'icon-pause'}"></span>`;
  const glow = document.getElementById('coverGlow');
  if (glow) glow.classList.toggle('pulsing', !audioPlayer.paused);
}

function formatTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

audioPlayer.addEventListener('play', () => {
  refreshPlayingIndicators();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});
audioPlayer.addEventListener('pause', refreshPlayingIndicators);
audioPlayer.addEventListener('ended', playNextGlobal);
audioPlayer.addEventListener('timeupdate', () => {
  const prog = document.getElementById('mpProgress');
  if (audioPlayer.duration) prog.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
  document.getElementById('mpTime').textContent = `${formatTime(audioPlayer.currentTime)} / ${formatTime(audioPlayer.duration)}`;
});

document.getElementById('thPlayBtn').addEventListener('click', () => {
  if (state.track === -1) return;
  if (isRowPlaying(state.album, state.track)) togglePlayPause();
  else playTrackDirect(state.album, state.track);
});
document.getElementById('mpPlayPause').addEventListener('click', togglePlayPause);
document.getElementById('mpNext').addEventListener('click', playNextGlobal);
document.getElementById('mpPrev').addEventListener('click', playPrevGlobal);
document.getElementById('mpProgress').addEventListener('input', (e) => {
  if (audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
});

// ── VOLUME CONTROL ──
const mpMuteBtn = document.getElementById('mpMute');
const mpVolumeSlider = document.getElementById('mpVolume');
let lastVolume = 1;

audioPlayer.volume = 1;

function updateVolumeIcon() {
  if (audioPlayer.muted || audioPlayer.volume === 0) mpMuteBtn.textContent = '🔇';
  else if (audioPlayer.volume < 0.5) mpMuteBtn.textContent = '🔉';
  else mpMuteBtn.textContent = '🔊';
}

mpVolumeSlider.addEventListener('input', (e) => {
  const v = e.target.value / 100;
  audioPlayer.volume = v;
  audioPlayer.muted = false;
  if (v > 0) lastVolume = v;
  updateVolumeIcon();
});

mpMuteBtn.addEventListener('click', () => {
  if (audioPlayer.muted || audioPlayer.volume === 0) {
    audioPlayer.muted = false;
    audioPlayer.volume = lastVolume || 1;
    mpVolumeSlider.value = Math.round(audioPlayer.volume * 100);
  } else {
    lastVolume = audioPlayer.volume;
    audioPlayer.muted = true;
    mpVolumeSlider.value = 0;
  }
  updateVolumeIcon();
});

// ── MOBILE TAB BAR ──
const mobileTabButtons = document.querySelectorAll('.mobile-tab-btn');
const appMainEl = document.querySelector('.app-main');
function setMobileView(view) {
  appMainEl.dataset.view = view;
  mobileTabButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
}
mobileTabButtons.forEach(btn => {
  btn.addEventListener('click', () => setMobileView(btn.dataset.view));
});
setMobileView('tracks');

// ── VISUALIZER PLACEMENT (mobile: right below artwork / desktop: original nested spot) ──
function positionVisualizer() {
  const canvas = document.getElementById('coverPulse');
  const coverPane = document.querySelector('.cover-pane');
  const coverImgWrap = document.querySelector('.cover-img-wrap');
  const coverBottom = document.querySelector('.cover-bottom');
  if (!canvas || !coverPane || !coverImgWrap || !coverBottom) return;
  if (window.innerWidth <= 980) {
    if (canvas.parentElement !== coverPane) {
      coverImgWrap.insertAdjacentElement('afterend', canvas);
    }
  } else {
    if (canvas.parentElement !== coverBottom) {
      coverBottom.appendChild(canvas);
    }
  }
}
positionVisualizer();
window.addEventListener('resize', positionVisualizer);

// ── SWIPE BETWEEN MOBILE TABS ──
const mobileTabOrder = ['tracks', 'cover', 'lyrics'];
let touchStartX = 0, touchStartY = 0;

appMainEl.addEventListener('touchstart', (e) => {
  if (window.innerWidth > 980) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

appMainEl.addEventListener('touchend', (e) => {
  if (window.innerWidth > 980) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const idx = mobileTabOrder.indexOf(appMainEl.dataset.view);
    if (dx < 0 && idx < mobileTabOrder.length - 1) setMobileView(mobileTabOrder[idx + 1]);
    else if (dx > 0 && idx > 0) setMobileView(mobileTabOrder[idx - 1]);
  }
}, { passive: true });

// ── LYRICS PANEL TOGGLE (desktop) ──
const textPaneInner = document.getElementById('textPaneInner');
const textPaneToggle = document.getElementById('textPaneToggle');
textPaneToggle.addEventListener('click', () => {
  const collapsed = textPaneInner.classList.toggle('collapsed');
  textPaneToggle.textContent = collapsed ? '»' : '«';
  textPaneToggle.title = collapsed ? 'Show lyrics panel' : 'Hide lyrics panel';
});

// ── ARTWORK PANEL TOGGLE (desktop) ──
const coverPaneInner = document.getElementById('coverPaneInner');
const coverPaneToggle = document.getElementById('coverPaneToggle');
const coverPane = document.querySelector('.cover-pane');
coverPaneToggle.addEventListener('click', () => {
  const collapsed = coverPaneInner.classList.toggle('collapsed');
  coverPane.classList.toggle('panel-collapsed', collapsed);
  coverPaneToggle.textContent = collapsed ? '»' : '«';
  coverPaneToggle.title = collapsed ? 'Show artwork panel' : 'Hide artwork panel';
});

// ── FULLSCREEN TOGGLE ──
const fsBtn = document.getElementById('fullscreenBtn');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => console.warn('Fullscreen request failed:', err));
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? '⤢' : '⛶';
  fsBtn.title = document.fullscreenElement ? 'Exit fullscreen' : 'Toggle fullscreen';
});

// ── PRELOADER ──
(function () {
  const loadingScreen = document.getElementById('loadingScreen');
  const loadingPct = document.getElementById('loadingPct');
  const loadingBarFill = document.getElementById('loadingBarFill');

  // Critical: every wallpaper + every album cover — these are seen immediately when switching albums.
  const criticalUrls = [];
  Object.values(ALBUMS).forEach(a => criticalUrls.push(a.cover));

  let loaded = 0;
  const total = criticalUrls.length;

  function updateProgress() {
    loaded++;
    const pct = Math.round((loaded / total) * 100);
    loadingPct.textContent = ` ${pct}%`;
    loadingBarFill.style.width = pct + '%';
    if (loaded >= total) finishLoading();
  }

  function finishLoading() {
    loadingScreen.classList.add('hidden');
    setTimeout(() => loadingScreen.remove(), 700);
    backgroundPreloadTrackArt();
  }

  criticalUrls.forEach(url => {
    const img = new Image();
    img.onload = updateProgress;
    img.onerror = updateProgress; // don't let a missing file hang the loading screen forever
    img.src = url;
  });

  // Safety net: never block the app for more than 6 seconds, even if something 404s silently.
  setTimeout(finishLoading, 6000);

  // Non-blocking: quietly warm the browser cache for every track's artwork after the app is usable,
  // so clicking into a track later doesn't show a pop-in.
  function backgroundPreloadTrackArt() {
    const urls = [];
    Object.values(ALBUMS).forEach(a => a.tracks.forEach(t => { if (t.image) urls.push(t.image); }));
    let i = 0;
    function loadNext() {
      if (i >= urls.length) return;
      const img = new Image();
      img.onload = img.onerror = () => { i++; loadNext(); };
      img.src = urls[i];
    }
    loadNext();
  }
})();

// ── INIT ──
renderAlbumTabs();
renderTrackNav();
renderCover();
renderText();
initPulseCanvas();
</script>
