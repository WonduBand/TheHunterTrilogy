<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WONDU — Lyrics &amp; Artwork Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #6b8f3f; --accent-deep: #4a6b2a; --accent-pale: #a8cf7f;
    --bg: #0a0d09; --bg-panel: #12160e; --bg-raise: #191f13;
    --border: #2a3820; --border-dim: #1c2615;
    --text-dim: #7c9166;
  }

  html, body { height: 100%; background: var(--bg); font-family: 'Share Tech Mono', monospace; color: #ccc; }
  body { transition: background 0.5s ease; overflow: hidden; }

  body[data-album="1"] { --accent:#6b8f3f; --accent-deep:#4a6b2a; --accent-pale:#a8cf7f; --bg:#0a0d09; --bg-panel:#12160e; --bg-raise:#191f13; --border:#2a3820; --border-dim:#1c2615; --text-dim:#7c9166; }
  body[data-album="2"] { --accent:#c62a2a; --accent-deep:#8a1c1c; --accent-pale:#e88080; --bg:#0c0a0a; --bg-panel:#171213; --bg-raise:#1f1719; --border:#3a2224; --border-dim:#2c1618; --text-dim:#a17878; }
  body[data-album="3"] { --accent:#d97e2a; --accent-deep:#a3591a; --accent-pale:#f0b878; --bg:#0a0806; --bg-panel:#181310; --bg-raise:#201a15; --border:#3a2c1e; --border-dim:#2a1f14; --text-dim:#b09680; }

  .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto auto; }

  /* ── TOPBAR ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1.4rem; border-bottom: 1px solid var(--border);
    background: var(--bg-panel); transition: border-color 0.5s ease, background 0.5s ease;
  }
  .topbar-brand { display: flex; align-items: baseline; gap: 0.8rem; }
  .topbar-title { font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.3em; font-size:1rem; text-transform:uppercase; color:#eee; }
  .topbar-sub { font-size:0.58rem; letter-spacing:0.2em; color: var(--text-dim); text-transform:uppercase; transition: color 0.5s ease; }
  .topbar-stamp { font-size:0.55rem; letter-spacing:0.2em; color: var(--accent); text-transform:uppercase; transition: color 0.5s ease; }
  @media (min-width: 981px) { .topbar-stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); } }
  .topbar { position: relative; }

  /* ── MAIN GRID ── */
  .app-main {
    display: grid;
    grid-template-columns: 260px minmax(0,1fr) minmax(0,1fr);
    min-height: 0;
  }

  /* ── SIDEBAR ── */
  .sidebar { background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; transition: border-color 0.5s ease, background 0.5s ease; }

  .album-tabs { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.8rem; border-bottom: 1px solid var(--border); transition: border-color 0.5s ease; }
  .album-tab {
    font-family:'Rajdhani',sans-serif; border: 1px solid #333; color: #999; cursor: pointer;
    transition: all 0.2s; position: relative; display: flex; align-items: center; gap: 0.7rem;
    padding: 0.5rem 0.6rem; text-align: left; background: var(--bg-raise);
  }
  .album-tab .tab-thumb {
    width: 3.6rem; height: 3.6rem; flex-shrink: 0; background: var(--bg);
    border: 1px solid var(--border-dim); display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .album-tab .tab-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .album-tab .tab-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .album-tab .num { font-size: 0.55rem; font-weight: bold; letter-spacing: 0.2em; color: var(--text-dim); transition: color 0.5s ease; }
  .album-tab .title-text { font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
  .album-tab:hover { border-color: #888; }
  .album-tab:hover .title-text { color: #fff; }
  .album-tab.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .album-tab.active .tab-thumb { border-color: var(--accent-deep); }
  .album-tab.active .num { color: var(--accent-pale); }
  .album-tab.active .title-text { color: #fff; }

  .track-nav { flex: 1; overflow-y: auto; padding: 0.4rem; }
  .track-row {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.6rem; cursor: pointer;
    user-select: none; border-left: 2px solid transparent; transition: all 0.15s; border-radius: 2px;
  }
  .track-row:hover { background: var(--bg-raise); }
  .track-row.active { background: var(--bg-raise); border-left-color: var(--accent); }
  .track-row .t-num { font-size: 0.58rem; color: var(--accent-deep); min-width: 1.6rem; transition: color 0.5s ease; }
  .track-row .t-title { font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.06em; font-size: 0.82rem; text-transform: uppercase; color: #99a; flex:1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-row.active .t-title { color: var(--accent-pale); }

  .cover-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.65rem 0.6rem; margin: 0.4rem 0.4rem 0.5rem; cursor: pointer; user-select: none;
    border: 1px solid var(--border); border-left: 2px solid var(--border-dim);
    transition: all 0.15s;
  }
  .cover-row:hover { background: var(--bg-raise); border-color: var(--accent-deep); }
  .cover-row.active { background: var(--bg-raise); border-left-color: var(--accent); border-color: var(--accent-deep); }
  .cover-row .c-icon { font-size: 0.85rem; color: var(--accent); transition: color 0.5s ease; }
  .cover-row .c-label { font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.15em; font-size: 0.78rem; text-transform: uppercase; color: #ccd; }
  .cover-row.active .c-label { color: var(--accent-pale); }
  .track-nav-divider { height: 1px; background: var(--border); opacity: 0.6; margin: 0 0.6rem 0.5rem; transition: background 0.5s ease; }

  .album-overview { padding: 0.4rem 0 1rem; }
  .ao-tagline { font-size: 0.95rem; font-style: italic; color: #ddd; line-height: 1.7; margin-bottom: 1.4rem; }
  .ao-meta { display: flex; flex-wrap: wrap; gap: 1.2rem 1.8rem; padding-bottom: 1.2rem; }
  .ao-meta div { font-size: 0.62rem; letter-spacing: 0.12em; color: var(--text-dim); text-transform: uppercase; transition: color 0.5s ease; }
  .ao-meta span { color: var(--accent); display: block; margin-top: 0.2rem; font-size: 0.75rem; transition: color 0.5s ease; }

  .sidebar-foot { padding: 0.6rem 1rem; font-size: 0.52rem; letter-spacing: 0.15em; color: #333; border-top: 1px solid var(--border); text-transform: uppercase; transition: border-color 0.5s ease; }
  @media (max-width: 980px) { .sidebar-foot { display: none; } }

  /* ── COVER PANE (fixed artwork) ── */
  .cover-pane { position: relative; overflow: hidden; border-right: 1px solid var(--border); transition: border-color 0.5s ease; }
  .cover-img-wrap { position: absolute; inset: 0; }
  .cover-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.92; }
  .cover-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.45) 32%, rgba(0,0,0,0.05) 55%, rgba(0,0,0,0.25) 100%); }
  .cover-content { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding: 1.6rem 2rem; }
  .cover-eyebrow { font-size: 0.62rem; letter-spacing: 0.35em; color: var(--accent); text-transform: uppercase; margin-bottom:0.5rem; transition: color 0.5s ease; }
  .cover-title { font-family:'Rajdhani',sans-serif; font-size: clamp(1.8rem, 3.6vw, 3rem); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; line-height: 1.05; text-shadow: 0 0 40px rgba(0,0,0,0.8); }
  .cover-tagline { font-size: 0.8rem; font-style: italic; color: #ddd; margin-top: 0.6rem; max-width: 480px; }
  .cover-story { font-size: 0.82rem; line-height: 1.65; color: #ddd; margin-top: 0.8rem; max-width: 560px; border-left: 2px solid var(--accent); padding-left: 0.9rem; transition: border-color 0.5s ease; }
  .cover-story:empty { display: none; }
  .cover-meta { display:flex; flex-wrap: wrap; gap: 1.4rem; margin-top: 1.1rem; font-size: 0.58rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
  .cover-meta span { color: var(--accent); transition: color 0.5s ease; }

  /* ── TEXT PANE (fixed lyrics) ── */
  .text-pane { display: flex; flex-direction: column; min-height: 0; }
  .text-head { padding: 1rem 1.6rem 0.8rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem; transition: border-color 0.5s ease; }
  .text-head .th-num { font-size: 0.62rem; color: var(--accent-deep); letter-spacing: 0.1em; transition: color 0.5s ease; }
  .text-head .th-title { font-family:'Rajdhani',sans-serif; font-size: 1.3rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .text-nav-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); width: 1.8rem; height: 1.8rem; cursor: pointer; font-size: 0.75rem; flex-shrink:0; transition: all 0.2s; }
  .text-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .text-nav-btn:disabled { opacity: 0.25; cursor: default; }
  .icon-tri-right { display:inline-block; width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid currentColor; }
  .icon-tri-left { display:inline-block; width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-right: 8px solid currentColor; }

  .text-body { flex: 1; overflow-y: auto; padding: 1.2rem 1.6rem 2.2rem; }
  @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
  .text-body > * { animation: fadeInLeft 0.35s ease both; }

  .lyric-section { margin-bottom: 1.2rem; }
  .sec-label { font-size: 0.6rem; letter-spacing: 0.2em; margin-bottom: 0.45rem; display: flex; align-items: center; gap: 0.5rem; color: var(--accent); text-transform: uppercase; transition: color 0.5s ease; }
  .sec-label::after { content: ''; flex: 1; height: 1px; background: var(--border); opacity: 0.5; max-width: 80px; }
  .sec-lines { font-size: 0.85rem; line-height: 1.85; white-space: pre-line; color: #f0f0e8; padding-left: 0.5rem; }
  .lyric-section.final-chorus .sec-label { color: var(--accent-pale); }
  .lyric-section.final-chorus .sec-lines { color: #fff; text-shadow: 0 0 14px rgba(255,255,255,0.12); }
  .lyric-section.bridge .sec-lines { color: var(--accent-pale); font-style: italic; opacity: 0.9; }
  .sec-lines strong { color: var(--accent); text-shadow: 0 0 12px var(--accent); font-weight: 700; }

  /* ── ROW PLAY BUTTONS ── */
  .row-play-btn {
    flex-shrink: 0; width: 1.4rem; height: 1.4rem; border-radius: 50%;
    border: 1px solid var(--border-dim); background: transparent; color: var(--text-dim);
    font-size: 0.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .row-play-btn:hover { border-color: var(--accent); color: var(--accent); }
  .track-row.playing { background: var(--bg-raise); }
  .track-row.playing .row-play-btn { border-color: var(--accent); color: var(--accent); background: var(--bg); }
  .track-row.playing .t-title { color: var(--accent-pale); }
  .th-play-btn { color: var(--accent); }

  /* ── MINI PLAYER ── */
  .mini-player {
    display: none; align-items: center; gap: 1rem; padding: 0.55rem 1.4rem;
    background: var(--bg-panel); border-top: 1px solid var(--border);
    transition: border-color 0.5s ease, background 0.5s ease;
  }
  .mini-player.active { display: flex; animation: miniPlayerIn 0.4s cubic-bezier(.4,0,.2,1); }
  @keyframes miniPlayerIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .mp-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    width: 2rem; height: 2rem; border-radius: 50%; flex-shrink: 0; cursor: pointer;
    font-size: 0.7rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .mp-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mp-play { width: 2.3rem; height: 2.3rem; font-size: 0.8rem; }
  .mp-info { min-width: 0; flex: 0 0 auto; width: 200px; overflow: hidden; }
  .mp-title { font-family:'Rajdhani',sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-album { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.5s ease; }
  .mp-progress {
    flex: 1; min-width: 0; height: 3px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; cursor: pointer; outline: none; transition: background 0.5s ease;
  }
  .mp-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .mp-progress::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  .mp-time { font-size: 0.55rem; color: var(--text-dim); letter-spacing: 0.05em; white-space: nowrap; flex-shrink: 0; transition: color 0.5s ease; }
  .mp-volume { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .mp-vol-slider {
    width: 70px; height: 3px; -webkit-appearance: none; appearance: none;
    background: var(--border); border-radius: 2px; cursor: pointer; outline: none; transition: background 0.5s ease;
  }
  .mp-vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .mp-vol-slider::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }
  @media (max-width: 700px) {
    .mp-info { width: 110px; }
    .mp-time { display: none; }
    .mp-vol-slider { width: 46px; }
  }
  .icon-pause { display:inline-block; width: 8px; height: 10px; position: relative; }
  .icon-pause::before, .icon-pause::after { content: ''; position: absolute; top: 0; width: 3px; height: 10px; background: currentColor; }
  .icon-pause::before { left: 0; }
  .icon-pause::after { left: 5px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-deep); }

  /* ── MOBILE TAB BAR ── */
  .mobile-tabbar { display: none; }
  @media (max-width: 980px) {
    .app { grid-template-rows: auto 1fr auto auto; }

    .app-main { grid-template-columns: 1fr; position: relative; overflow: hidden; }

    /* All three panes stay mounted and slide horizontally; only one is in view at a time */
    .sidebar, .cover-pane, .text-pane {
      display: flex; position: absolute; inset: 0;
      height: 100%; max-height: none; border: none;
      transition: transform 0.38s cubic-bezier(.4,0,.2,1);
      will-change: transform;
    }
    .cover-pane {
      flex-direction: column;
      overflow-y: auto;
      align-items: stretch;
    }
    .cover-img-wrap {
      position: relative; inset: auto;
      width: 100%; flex-shrink: 0;
    }
    .cover-img { height: auto; object-fit: contain; display: block; }
    .cover-scrim { display: none; }
    .cover-content {
      position: relative; z-index: auto;
      flex: 0 0 auto;
      background: #000;
      height: auto;
      margin-top: 0;
      padding: 1.6rem 1.4rem 1.8rem;
      justify-content: flex-start;
    }

    /* Default resting order: tracks | cover | lyrics, left to right */
    .sidebar { transform: translateX(-100%); }
    .cover-pane { transform: translateX(0%); }
    .text-pane { transform: translateX(100%); }

    .app-main[data-view="tracks"] .sidebar { transform: translateX(0%); }
    .app-main[data-view="tracks"] .cover-pane { transform: translateX(100%); }
    .app-main[data-view="tracks"] .text-pane { transform: translateX(200%); }

    .app-main[data-view="cover"] .sidebar { transform: translateX(-100%); }
    .app-main[data-view="cover"] .cover-pane { transform: translateX(0%); }
    .app-main[data-view="cover"] .text-pane { transform: translateX(100%); }

    .app-main[data-view="lyrics"] .sidebar { transform: translateX(-200%); }
    .app-main[data-view="lyrics"] .cover-pane { transform: translateX(-100%); }
    .app-main[data-view="lyrics"] .text-pane { transform: translateX(0%); }

    .text-body { max-height: none; }

    .album-tabs {
      max-height: 40vh;
      overflow-y: auto;
      overflow-x: hidden;
      flex-shrink: 0;
    }

    .mobile-tabbar {
      display: flex; border-top: 1px solid var(--border); background: var(--bg-panel);
      transition: border-color 0.5s ease, background 0.5s ease;
    }
    .mobile-tab-btn {
      flex: 1; background: transparent; border: none; color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 0.6rem 0.2rem 0.55rem; display: flex; flex-direction: column;
      align-items: center; gap: 0.25rem; cursor: pointer; transition: color 0.2s;
    }
    .mobile-tab-btn.active { color: var(--accent); }
    .mtb-icon { font-size: 1.15rem; line-height: 1; }
  }

  @media (max-width: 480px) {
    .mini-player { gap: 0.5rem; padding: 0.5rem 0.8rem; }
    .mp-volume { display: none; }
    .text-head { padding: 0.8rem 1rem 0.7rem; gap: 0.5rem; }
    .text-head .th-num { display: none; }
    .text-head .th-title { font-size: 1.05rem; }
    .text-body { padding: 1rem 1.1rem 1.6rem; }
  }
</style>
</head>
<body data-album="1">

<div class="app">

  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-title">Wondu</div>
      <div class="topbar-sub">Lyrics &amp; Artwork Archive</div>
    </div>
    <div class="topbar-stamp" id="topbarStamp">⊙ THE HUNTER TRILOGY ⊙</div>
  </div>

  <div class="app-main" id="appMain" data-view="cover">

    <nav class="sidebar">
      <div class="album-tabs" id="albumTabs"></div>
      <div class="track-nav" id="trackNav"></div>
      <div class="sidebar-foot">⬡ Wondu — The Hunter Trilogy ⬡</div>
    </nav>

    <section class="cover-pane">
      <div class="cover-img-wrap">
        <img class="cover-img" id="coverImg" src="" alt="">
      </div>
      <div class="cover-scrim"></div>
      <div class="cover-content">
        <div class="cover-eyebrow" id="coverEyebrow">// Album I of III //</div>
        <div class="cover-title" id="coverTitle">The First Hunter</div>
        <div class="cover-tagline" id="coverTagline"></div>
        <div class="cover-story" id="coverStory"></div>
        <div class="cover-meta" id="coverMeta"></div>
      </div>
    </section>

    <section class="text-pane" id="textPane">
      <div class="text-head">
        <button class="text-nav-btn" id="prevBtn" title="Previous track"><span class="icon-tri-left"></span></button>
        <div class="th-num" id="thNum">// TRACK_01</div>
        <div class="th-title" id="thTitle">—</div>
        <button class="text-nav-btn th-play-btn" id="thPlayBtn" title="Play this track"><span class="icon-tri-right"></span></button>
        <button class="text-nav-btn" id="nextBtn" title="Next track"><span class="icon-tri-right"></span></button>
      </div>
      <div class="text-body" id="textBody"></div>
    </section>

  </div>

  <div class="mini-player" id="miniPlayer">
    <button class="mp-btn" id="mpPrev" title="Previous track"><span class="icon-tri-left"></span></button>
    <button class="mp-btn mp-play" id="mpPlayPause" title="Play / Pause"><span class="icon-tri-right" id="mpPlayIcon"></span></button>
    <button class="mp-btn" id="mpNext" title="Next track"><span class="icon-tri-right"></span></button>
    <div class="mp-info">
      <div class="mp-title" id="mpTitle">—</div>
      <div class="mp-album" id="mpAlbum">—</div>
    </div>
    <input type="range" class="mp-progress" id="mpProgress" min="0" max="100" value="0">
    <span class="mp-time" id="mpTime">0:00 / 0:00</span>
    <div class="mp-volume">
      <button class="mp-btn mp-vol-btn" id="mpMute" title="Mute / Unmute">🔊</button>
      <input type="range" class="mp-vol-slider" id="mpVolume" min="0" max="100" value="100" title="Volume">
    </div>
  </div>

  <div class="mobile-tabbar" id="mobileTabbar">
    <button class="mobile-tab-btn" data-view="tracks"><span class="mtb-icon">☰</span>Tracks</button>
    <button class="mobile-tab-btn active" data-view="cover"><span class="mtb-icon">◈</span>Cover</button>
    <button class="mobile-tab-btn" data-view="lyrics"><span class="mtb-icon">▤</span>Lyrics</button>
  </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
/* ============ ALBUM DATA ============ */
const ALBUMS = {
  1: {

        ["Final Chorus", "No gods above\nNo kings below\nYou took it all\nYou lost your soul\n\nNo gods above\nThat's what you say\nBut every empire\nEnds the same\n\nNo gods above\nSo hear me now\nYou built this world\n\nI'll tear it down"]
      ]},
      { title: "Marked", audio: "", image: "Album 2 - Legacy of the Mark/04-marked.png", story: "His symbol hangs over a crowd of thousands standing in perfect, obedient rows — the same Mark that once meant only him now stitched into a slogan about freedom that clearly means the opposite. Reclaiming his name starts with realizing how much of it they've already spent without asking.", sections: [
        ["Verse 1", "There it is above the gate\nCarved in black, ten stories straight\nOn every uniform I see\nThe same old mark that follows me\n\nI wore it long before this place\nBefore these towers had a name\nNow a million wear it proud\nBut they don't know what it's about"],
        ["Pre-Chorus", "Who took the sign?\nWho changed the name?\nWho turned my past\nInto their claim?"],
        ["Chorus", "Marked\nEvery wall, every street\nIs marked\nwith a piece of me\n\nYou took the sign\nYou made it law\nBut you don't know\nWhat it stands for\n\nMarked\nNow I finally see\nYou built your whole empire\nOn the memory of me"],
        ["Verse 2", "They carved my face into the stone\nMade a man I never knew\nPut their words into my mouth\nTurned the truth inside out\n\nMade a weapon of my name\nMade obedience from pain\nEverything I fought against\nNow carries my defense"],
        ["Pre-Chorus", "Who took the sign?\nWho changed the name?\nWho turned my past\nInto their claim?"],
        ["Chorus", "Marked\nEvery wall, every street\nIs marked\nwith a piece of me\n\nYou took the sign\nYou made it law\nBut you don't know\nWhat it stands for\n\nMarked\nNow I finally see\nYou built your whole empire\nOn the memory of me"],
        ["Bridge", "That's not my face\nThose aren't my words\nThat's not the reason\nThat I fought\n\nThat's not my law\nThat's not my throne\nYou stole the mark\n\nBut it's still my own"],
        ["Final Chorus", "Marked\nEvery wall, every street\nIs Marked\nNow they look at me\n\nYou took the sign\nYou made it law\nNow I'll remind you\nWhat it stands for\n\nMarked\nLet the whole city see\nYou built your whole empire\nOn the memory of me\n\nYou stole my name\nYou stole my past\n\nNow I'm taking it back"]
      ]},
      { title: "Savage Circuit", audio: "", image: "Album 2 - Legacy of the Mark/05-savage-circuit.png", story: "Every citizen in this line gets scanned, sorted, and waved through in under a second. His file stalls the whole gate. The system has an entire archive built around his myth and still cannot process the man standing in front of the camera — because the real thing was never built to fit inside their prediction models to begin with.", sections: [
        ["Verse 1", "Boots hit hard against the floor\nFive come in, I drop four\nRed lights flash, alarms ignite\nNow they know I'm here to fight\n\nLock the doors, shut me in\nSend another unit in\nYou can track my every move\nStill don't know what I will do"],
        ["Pre-Chorus", "Lock it down\nSound the call\nSend them in\nI'll take them all"],
        ["Chorus", "Savage circuit\nOverload\nI don't follow\nWhat you know\n\nSavage circuit\nLose control\nYou built the system\nI'll break the code"],
        ["Verse 2", "Cold machines predict the fight\nRead my left, I move my right\nEvery pattern that they learn\nI change again, tables turn\n\nCut the power, kill the light\nI don't need it for the fight\nNow your perfect system's blind\nCome and find me if you like"],
        ["Pre-Chorus", "Lock it down\nSound the call\nSend them in\nI'll take them all"],
        ["Chorus", "Savage circuit\nOverload\nI don't follow\nWhat you know\n\nSavage circuit\nLose control\nYou built the system\nI'll break the code"],
        ["Bridge", "Calculate\nAnticipate\nEvery move\nThat I could make\n\nRun it back\nTry again\nYour machine\nCan't understand\n\nInstinct\nNo command\n\nInstinct\nNo command"],
        ["Final Chorus", "Savage circuit\nOverload\nI don't follow\nWhat you know\n\nSavage circuit\nLose control\nYou built the system\nI'll break the code\n\nSavage circuit\nNow you know\nYou can't predict me\nYou can't control\n\nShut it down\nLet it blow\n\nI was never\nIn your code"]
      ]},
      { title: "The Hollow King", audio: "", image: "Album 2 - Legacy of the Mark/06-the-hollow-king.png", story: "Somewhere at the top of that skyline sits the man responsible for all of it — the mark turned into law, the myth turned into architecture. Before he ever reaches the throne room, the city itself makes the empire's scale impossible to ignore. Whoever built this believed permanence was simply a matter of building tall enough.", sections: [
        ["Verse 1", "Top floor, behind the glass\nWatching every second pass\nNever walking through the streets\nNever standing on your feet\n\nEvery screen repeats your face\nEvery order bears your name\nThey all fear the man above\nBut fear is never enough"],
        ["Pre-Chorus", "Come on down\nShow your face\nCome and stand\nIn what you made"],
        ["Chorus", "Hollow king\nOn a hollow throne\nYou own everything\nBut nothing of your own\n\nHollow king\nLet the whole world sing\nWhen the walls come down\nYou won't own a thing"],
        ["Verse 2", "How long have you ruled this place?\nHow long have you worn that face?\nSomething in your eyes is wrong\nLike the man inside is gone\n\nYou know the mark upon my skin\nYou know exactly where I've been\nBefore I even speak my name\nYou tell me why I came"],
        ["Pre-Chorus", "Come on down\nShow your face\nCome and stand\nIn what you made"],
        ["Chorus", "Hollow king\nOn a hollow throne\nYou own everything\nBut nothing of your own\n\nHollow king\nLet the whole world sing\nWhen the walls come down\nYou won't own a thing"],
        ["Bridge", "You say—\n\n\"I've waited all this time\nI knew you'd come alive\nA thousand years have passed\nAnd you're here at last\"\n\nSo tell me what you want\nTell me why I'm here\n\nHe looks at me and says—\n\n\"You brought me here.\""],
        ["Final Chorus", "Hollow king\nOn a hollow throne\nNow I know there's something\nI was never told\n\nHollow king\nWhat did I begin?\nIf I brought you here\n\nI'll take you out again\n\nHollow king\nYour time is done\nA thousand years\n\nAnd now I've come"]
      ]},
      { title: "Ghost in my Blood", audio: "", image: "Album 2 - Legacy of the Mark/07-ghost-in-my-blood.png", story: "They put my blood beneath the glass, compared it against a buried past, and built row after row of bodies trying to reproduce whatever lets him carry the Mark. Every copy failed. Whatever makes him what he is, it was never something that could be manufactured — only inherited, and only once.", sections: [
        ["Verse 1", "They put my blood beneath the glass\nCompare it to a buried past\nNumbers running down the screen\nShowing things I've never seen\n\nA thousand years, they tried and failed\nBuilt their copies, watched them fail\nEvery version came undone\nThey were waiting for the one"],
        ["Pre-Chorus", "What did you find?\nWhat do you know?\nWhat did I bring\nSo long ago?"],
        ["Chorus", "There's a ghost in my blood\nSomething you can't reproduce\nYou can take what you want\nBut it won't belong to you\n\nThere's a ghost in my blood\nFrom a world you never knew\nYou can make another man\nBut you can't make what made me"],
        ["Verse 2", "Rows of bodies, numbered names\nEvery face almost the same\nMade to carry what I bear\nBut there's nothing living there\n\nNow I know why I was brought\nWhy a thousand years were bought\nYou don't need the man I am\nYou just need what makes the mark"],
        ["Pre-Chorus", "What did you find?\nWhat do you know?\nWhat did I bring\nSo long ago?"],
        ["Chorus", "There's a ghost in my blood\nSomething you can't reproduce\nYou can take what you want\nBut it won't belong to you\n\nThere's a ghost in my blood\nFrom a world you never knew\nYou can make another man\nBut you can't make what made me"],
        ["Bridge", "Take my blood\nTake my skin\nBuild your army\nTry again\n\nMake a thousand\nMake them strong\n\nYou can copy everything\nAnd still get it wrong"],
        ["Final Chorus", "There's a ghost in my blood\nAnd you'll never make it yours\nYou can build another body\nYou can manufacture war\n\nThere's a ghost in my blood\nFrom before your world began\nYou can make another weapon\n\nBut you can't make who I am\n\nYou wanted what was in me\n\nNow you know\nYou can't have it"]
      ]},
      { title: "Losing my Name", audio: "", image: "Album 2 - Legacy of the Mark/08-losing-my-name.png", story: "He tears down the statue of himself with his own hands — the clean, obedient version the empire built to justify its own authority. Soldiers watch and do nothing, unsure which version of him to believe. He does not need their permission to remember who he was before any of this made him a monument.", sections: [
        ["Verse 1", "My face is carved in every wall\nBut I don't know that man at all\nThey tell the stories like they know\nWhere I came from, where I'd go\n\nEvery word has been replaced\nEvery truth has been erased\nSay it long enough, it seems\nEven I forget what it means"],
        ["Pre-Chorus", "What was I\nBefore the fight?\nWho was I\nBefore that night?"],
        ["Chorus", "I'm losing my name\nA little every day\nEverybody knows me\nBut they don't know me\n\nI'm losing my name\nTo the man they say I am\nIf I tear the whole thing down\nWill I know myself again?"],
        ["Verse 2", "I can't remember home so clear\nA thousand years have disappeared\nFaces fading one by one\nI can't remember everyone\n\nAll I have is what I know\nKeep on moving, never slow\nBut if the fight is all I am\nThen maybe they were right"],
        ["Pre-Chorus", "What was I\nBefore the fight?\nWho was I\nBefore that night?"],
        ["Chorus", "I'm losing my name\nA little every day\nEverybody knows me\nBut they don't know me\n\nI'm losing my name\nTo the man they say I am\nIf I tear the whole thing down\nWill I know myself again?"],
        ["Bridge", "Take the statues down\nTake the banners down\nTake the stories\nBurn them out\n\nKeep the mark\nKeep the crown\nI don't need them\nI know now"],
        ["Final Chorus", "I won't lose my name\nTo the man you made of me\nI don't need your history\nTo tell me who to be\n\nI won't lose my name\nI remember who I am\nYou can tear the whole world down\nBut I will still remain\n\nI know my name\nI know my name\n\nAnd you don't own it"]
      ]},
      { title: "Break the Machine", audio: "", image: "Album 2 - Legacy of the Mark/09-break-the-machine.png", story: "What started as one man's refusal has become a crowd's. Thousands surround the empire's central spire, tearing down the same propaganda that once used his face to demand obedience. He is no longer fighting alone — his resistance gave everyone else permission to stop kneeling too.", sections: [
        ["Verse 1", "Shut the gates, cut the lines\nKill the power, kill the lights\nEvery tower, every screen\nTake away what keeps them clean\n\nHear the boots out in the street\nMore and more with every beat\nFor the first time they can see\nThis city isn't what it seemed"],
        ["Pre-Chorus", "One by one\nSide by side\nNo more fear\nNo place to hide"],
        ["Chorus", "You can lock us down\nYou can shut us out\nBut you can't stop what's coming now\n\nEvery wall you built\nEvery lie you sold\nWe're taking back what you controlled\n\nSound the alarm\nBring the whole thing down\n\nTonight we break the machine"],
        ["Verse 2", "Factory doors are opening\nWorkers pouring to the streets\nEvery block begins to turn\nEvery symbol starts to burn\n\nSoldiers lower what they hold\nSome still do what they are told\nNow the lines are breaking wide\nEverybody picks a side"],
        ["Pre-Chorus", "One by one\nSide by side\nNo more fear\nNo place to hide"],
        ["Chorus", "You can lock us down\nYou can shut us out\nBut you can't stop what's coming now\n\nEvery wall you built\nEvery lie you sold\nWe're taking back what you controlled\n\nSound the alarm\nBring the whole thing down\n\nTonight we break the machine"],
        ["Bridge", "Cut the feed\nCut the wire\nOpen every door\n\nKill the screens\nKill the power\nWe don't need them anymore\n\nNo command\nNo control\nNo one owns us now\n\nThree\nTwo\nOne\n\nShut it down"],
        ["Final Chorus", "You can't lock us down\nYou can't shut us out\nLook at what you've started now\n\nEvery wall you built\nEvery lie you sold\nNothing here is yours to hold\n\nSound the alarm\nHear the whole city now\n\nTonight we break the machine\n\nNo more commands\nNo more bowing down\n\nTonight we take back everything"]
      ]},
      { title: "Empire Fall", audio: "", image: "Album 2 - Legacy of the Mark/10-empire-fall.png", story: "The banners are still burning when the first tower goes dark. A thousand years of control collapses in a single night, screens dying block by block across a city that believed its own permanence. He watches it happen rather than replace it — an empire, once broken, does not need a new king standing where the old one fell.", sections: [
        ["Verse 1", "First light breaks across the street\nNo commands beneath our feet\nEvery screen has lost its face\nSilence running through the place\n\nSirens die one by one\nSmoke is rising with the sun\nAll the walls that stood so tall\nDon't look so high before they fall"],
        ["Pre-Chorus", "Hear that sound\nAll around\nWhat goes up\nIs coming down"],
        ["Chorus", "When the empire falls\nLet it fall\nLet it fall\n\nWhen the empire calls\nDon't answer anymore\n\nWe gave it everything\nIt took everything\n\nNow we stand\nAnd watch it fall\n\nWhen the empire falls"],
        ["Verse 2", "Upper floors begin to shake\nEvery lock begins to break\nAll the names above the doors\nDon't mean anything anymore\n\nNow the king is on his own\nNo more army, no more throne\nAll the power that he held\nCouldn't save him from himself"],
        ["Pre-Chorus", "Hear that sound\nAll around\nWhat goes up\nIs coming down"],
        ["Chorus", "When the empire falls\nLet it fall\nLet it fall\n\nWhen the empire calls\nDon't answer anymore\n\nWe gave it everything\nIt took everything\n\nNow we stand\nAnd watch it fall\n\nWhen the empire falls"],
        ["Bridge", "You wanted forever\nYou wanted it all\nYou wanted a kingdom\nThat never could fall\n\nLook out your window\nLook what remains\n\nNobody's coming\nWhen you call their names\n\nNo one is listening\nNo one obeys\n\nYour empire ends\nToday"],
        ["Final Chorus", "When the empire falls\nLet it fall\nLet it fall\n\nWhen the empire calls\nWe won't answer anymore\n\nYou took everything\nNow you have nothing\n\nHere we stand\nAnd watch it fall\n\nWhen the empire falls\nLet it fall\nLet it fall\n\nA thousand years\nTo build these walls\n\nOne night\n\nTo lose it all"]
      ]},
      { title: "The Wild Remains", audio: "", image: "Album 2 - Legacy of the Mark/11-the-wild-remains.png", story: "Morning comes without a single machine in the sky. In the silence after the fall, a single green shoot pushes up through a cracked street, past a screen that will never read SYSTEM OFFLINE again. Whatever the empire tried to pave over never actually died. It only waited for the control to stop.", sections: [
        ["Verse 1", "Morning comes without the lights\nNo machines across the sky\nFor the first time since I came\nI can hear the falling rain\n\nThrough the cracks beneath my feet\nSomething reaches through the street\nSmall and green against the grey\nSomething they couldn't take away"],
        ["Pre-Chorus", "All this time\nUnderneath\nIt was waiting\nTo be free"],
        ["Chorus", "The wild remains\nThe wild remains\nYou can bury it\nBut it won't stay down\n\nThe wild remains\nAfter everything\nGive it time\nIt will take back the ground"],
        ["Verse 2", "Roots are breaking through the stone\nGrowing where they don't belong\nThrough the towers, through the roads\nLife returns to what was cold\n\nI remember somewhere green\nAlmost like it came from dreams\nFor a moment I can see\nThe world that used to carry me"],
        ["Pre-Chorus", "All this time\nUnderneath\nIt was waiting\nTo be free"],
        ["Chorus", "The wild remains\nThe wild remains\nYou can bury it\nBut it won't stay down\n\nThe wild remains\nAfter everything\nGive it time\nIt will take back the ground"],
        ["Bridge", "No more orders\nNo alarms\nNo more numbers\nOn their arms\n\nNo more towers\nBlocking out the sun\n\nFor the first time\nIn a thousand years\n\nThe old world\nHas begun"],
        ["Final Chorus", "The wild remains\nThe wild remains\nYou can bury it\nBut it won't stay down\n\nThe wild remains\nAfter everything\nNow I see it\nBreaking through the ground\n\nThe wild remains\nAnd so do I\nDifferent world\nUnder the same sky\n\nA thousand years\nCouldn't end this place\n\nEverything changes\n\nBut the wild remains"]
      ]}
    ]
  },
  3: {
    title: "Where Worlds End", cover: "Album 3 - Where Worlds End/00-where-worlds-end-cover.png",
    label: "// Album III of III — The Hunter Trilogy //",
    tagline: '"Some things end so life can grow."',
    meta: [['GENRE','Epic / Cosmic Metal'],['TRACKS','11'],['SETTING','Beyond the Stars']],
    tracks: [
      { title: "Dead Signal", audio: "", image: "Album 3 - Where Worlds End/01-dead-signal.png", story: "The city has been quiet for days — no orders, no sirens, nothing but rain on dead concrete. Then one screen in an abandoned control room flickers back to life on its own, filling with red noise that shouldn't have a source anymore. Whatever just came back online was never part of the empire's network to begin with.", sections: [
        ["Verse 1", "Morning breaks across the grey\nSmoke is slowly blown away\nNo more orders, no machines\nJust the sound of something free\n\nPeople walking through the rain\nLearning how to live again\nFor a moment I believe\nMaybe I can finally leave"],
        ["Pre-Chorus", "Then the sky\nStarts to change\nOne red light\nFar away"],
        ["Chorus", "There's a dead signal\nCalling out my name\nA dead signal\nFrom a world away\n\nI thought it ended\nI thought I was free\nBut that dead signal\nIs calling me"],
        ["Verse 2", "Every screen begins to glow\nOne by one, row by row\nNo command and no control\nJust a sound from somewhere cold\n\nThen the mark upon my skin\nBurns like it did back then\nI remember that old call\nBefore I ever knew at all"],
        ["Pre-Chorus", "In the sky\nSomething burns\nAfter all\nIt has returned"],
        ["Chorus", "There's a dead signal\nCalling out my name\nA dead signal\nFrom a world away\n\nI thought it ended\nI thought I was free\nBut that dead signal\nIs calling me"],
        ["Bridge", "Not again\nNot this time\nI've been yours\nAll my life\n\nTell me where\nTell me why\nWhat the hell\nIs in that sky?"],
        ["Final Chorus", "There's a dead signal\nCalling out my name\nA dead signal\nFrom a world away\n\nI thought it ended\nI thought I was free\nBut that dead signal\nIs calling me\n\nThere's a dead signal\nBurning through the sky\nA dead signal\nAnd I don't know why\n\nThen one voice\nCuts through the air—\n\n\"We found you.\""]
      ]},
      { title: "From Beyond", audio: "", image: "Album 3 - Where Worlds End/02-from-beyond.png", story: "The rift in the sky finally lets something through, and it is bigger than anything the city has fought before. Soldiers who were killing each other days ago now stand shoulder to shoulder, because whatever just arrived does not care which side of the old war anyone was on. The fight has stopped being local.", sections: [
        ["Verse 1", "Black sun hanging overhead\nAll the city glowing red\nEvery signal, every screen\nShows a place I've never seen\nSomething moving past the light\nComing closer through the night\nThen the ground begins to shake\nAnd the heavens start to break"],
        ["Pre-Chorus", "Hear the sound\nFeel it grow\nSomething's coming\nFrom below"],
        ["Chorus", "From beyond\nThey are calling\nFrom beyond\nI hear them now\nThrough the dark\nThrough the silence\nFrom beyond\nThey're coming down"],
        ["Verse 2", "Fire falling from the sky\nPeople running for their lives\nShapes are forming in the clouds\nThen the first one touches down\nSteel and stone begin to burn\nNow the whole damn city turns\nEvery soldier takes their place\nWaiting for what comes our way"],
        ["Pre-Chorus", "Hear the sound\nFeel it grow\nNow we know\nWe're not alone"],
        ["Chorus", "From beyond\nThey are calling\nFrom beyond\nI hear them now\nThrough the dark\nThrough the silence\nFrom beyond\nThey're coming down\n\nFrom beyond\nLet them find me\nI've been running long enough\nIf they came\nTo take this world\nThen they're coming through us"],
        ["Bridge", "Raise the walls\nSound the call\nYesterday\nWe watched them fall\nNow the ones\nI came to fight\nStand with me\nHere tonight"],
        ["Final Chorus", "From beyond\nThey are calling\nFrom beyond\nWe hear them now\nThrough the dark\nThrough the silence\nFrom beyond\nThey're coming down\n\nFrom beyond\nLet them find us\nWe have nowhere left to run\nIf they came\nTo take this world\nThen let them fucking come\n\nFrom beyond\nFrom beyond\n<strong>LET THEM COME</strong>"]
      ]},
      { title: "Black Horizon", audio: "", image: "Album 3 - Where Worlds End/03-black-horizon.png", story: "He follows the invader back through the same tear it came from, and the world behind it simply stops being a world he recognizes. Debris the size of buildings drifts past him in total silence. Far off, half-buried in the wreckage of somewhere else entirely, a tower bears the exact same Mark burned into his own skin.", sections: [
        ["Verse 1", "Fire burns across the ground\nBroken ships are falling down\nWhat came through is pulling back\nDisappearing into black\nThere's a doorway in the sky\nWide enough to swallow light\nAnd the mark begins to burn\nLike it knows where they return"],
        ["Pre-Chorus", "One way in\nNo way back\nOne more road\nInto the black"],
        ["Chorus", "Black horizon\nOpen wide\nThere's another world\nOn the other side\nBlack horizon\nTake me through\nIf you're calling me\nI'm coming for you"],
        ["Verse 2", "Leave the towers far behind\nCross the edge and lose the light\nNo more ground beneath my feet\nNothing here looks real to me\nWorlds are hanging in the dark\nBroken pieces, burning stars\nAncient ruins drift alone\nOlder than the world I know"],
        ["Pre-Chorus", "No way down\nNo way back\nOnly forward\nThrough the black"],
        ["Chorus", "Black horizon\nOpen wide\nThere's another world\nOn the other side\nBlack horizon\nTake me through\nIf you're calling me\nI'm coming for you\n\nBlack horizon\nHere I stand\nTake me further\nThan I've ever been\nI don't know\nWhat waits inside\nBut I'm crossing\nThe other side"],
        ["Bridge", "World after world\nEnd after end\nHow far does this go?\nName after name\nGone without trace\nHow many came before?\nThen I see\nAcross the dark\nAnother world\n<strong>With my mark</strong>"],
        ["Final Chorus", "Black horizon\nNow I see\nThere's something here\nThat remembers me\nBlack horizon\nWorlds collide\nA thousand fires\nBurning side by side\nBlack horizon\nNo turning back\nI've come too far\nTo fear the black\nWhatever waits\nBeyond that light\n<strong>I'm coming through\nTo find out why</strong>\n<strong>I'm coming through\nTo find out why</strong>"]
      ]},
      { title: "No Stars Here", audio: "", image: "Album 3 - Where Worlds End/04-no-stars-here.png", story: "There is no sky here, only the broken tops of worlds that used to have one. He crosses a bridge between two dead civilizations and finds a single word scratched into the stone by someone who did not survive long enough to explain it further. Whatever came through here before him left in a hurry, and left a warning instead of a name.", sections: [
        ["Verse 1", "No sun rising in the east\nNo moon hanging over me\nOnly worlds across the black\nSome are whole and some are cracked\n\nNo wind moving through this place\nNo direction, time or day\nI look up but nothing's clear\nThere are no stars here"],
        ["Pre-Chorus", "Where am I?\nWhat is this?\nHow many worlds\nEnd like this?"],
        ["Chorus", "There are no stars here\nNo light above\nNothing to guide me\nNothing I know\n\nThere are no stars here\nJust worlds in the dark\nSomething came through them\nAnd tore them apart"],
        ["Verse 2", "Cities broken clean in two\nEmpty roads still running through\nShips lie buried in the stone\nEvery world has been left cold\n\nThen I find it on a wall\nSame damn mark above them all\nCut into the blackened stone\nFar away from home"],
        ["Pre-Chorus", "Who was here?\nWho survived?\nWho left the mark\nBefore they died?"],
        ["Chorus", "There are no stars here\nNo light above\nNothing to guide me\nNothing I know\n\nThere are no stars here\nJust worlds in the dark\nSomething came through them\nAnd tore them apart"],
        ["Bridge", "One world\nThen another\nOne grave\nThen another\n\nSame mark\nEvery time\nSame warning\nEvery line"],
        ["Final Chorus", "There are no stars here\nNow I know why\nSomething is moving\nOutside of the light\n\nThere are no stars here\nJust worlds left behind\nWhatever destroyed them\nIs coming for mine\n\nCut in the stone\nOne final word—\n\n<strong>\"RUN.\"</strong>"]
      ]},
      { title: "The Others", audio: "", image: "Album 3 - Where Worlds End/05-the-others.png", story: "The chamber is a memorial, though no one built it to be gentle about it. Figures in armor from ages and worlds he doesn't recognize stand frozen around the same symbol burned into his own arm — rulers, slaves, warriors, all called the same way he was. None of their statues are missing. None of them made it back.", sections: [
        ["Verse 1", "Figures carved into the stone\nStanding there in rows alone\nDifferent faces, different names\nEvery one who came this way\n\nEvery weapon, every scar\nEvery world beneath a mark\nThen I see above their hands\nThe same damn sign I understand"],
        ["Pre-Chorus", "One by one\nSide by side\nThey were here\nBefore they died"],
        ["Chorus", "There were others\nJust like me\nThere were others\nI can see\n\nDifferent worlds\nDifferent wars\nSame old mark\nThat we all wore"],
        ["Verse 2", "Some were kings and some were slaves\nSome were young and some were grey\nEvery carving tells the same\nThey were called and then they came\n\nThrough the dark and through the gate\nEvery one was brought this way\nNow their weapons line the wall\nBut no one came back at all"],
        ["Pre-Chorus", "One by one\nSide by side\nThey came here\nAnd here they died"],

/* ============ STATE ============ */
// state = what's being VIEWED in the sidebar/cover/lyrics panes.
// playingAlbum/playingIdx = what's actually PLAYING — deliberately decoupled,
// so browsing around doesn't interrupt playback.
const state = { album: 1, track: -1 };
let playingAlbum = null;
let playingIdx = null;
const audioPlayer = document.getElementById('audioPlayer');
const MIN_ALBUM = 1;
const MAX_ALBUM = Object.keys(ALBUMS).length;

/* ============ HELPERS ============ */
function sectionClass(label) {
  const l = label.toLowerCase();
  if (l.includes('final')) return 'final-chorus';
  if (l.includes('bridge')) return 'bridge';
  return '';
}

function formatTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function isRowPlaying(albumNum, idx) {
  return playingAlbum === albumNum && playingIdx === idx;
}

/* ============ RENDER ============ */
function renderAlbumTabs() {
  const wrap = document.getElementById('albumTabs');
  wrap.innerHTML = '';
  Object.keys(ALBUMS).forEach(num => {
    const a = ALBUMS[num];
    const btn = document.createElement('div');
    btn.className = 'album-tab' + (Number(num) === state.album ? ' active' : '');
    btn.innerHTML = `
      <div class="tab-thumb"><img src="${a.cover}" alt="${a.title} cover"></div>
      <div class="tab-info">
        <span class="num">ALBUM ${String(num).padStart(2,'0')}</span>
        <span class="title-text">${a.title}</span>
      </div>
    `;
    btn.addEventListener('click', () => selectAlbum(Number(num)));
    wrap.appendChild(btn);
  });
}

function renderTrackNav() {
  const wrap = document.getElementById('trackNav');
  wrap.innerHTML = '';
  const album = ALBUMS[state.album];

  const coverRow = document.createElement('div');
  coverRow.className = 'cover-row' + (state.track === -1 ? ' active' : '');
  coverRow.innerHTML = `<span class="c-icon">⬢</span><span class="c-label">Album Cover</span>`;
  coverRow.addEventListener('click', () => selectTrack(-1));
  wrap.appendChild(coverRow);

  const divider = document.createElement('div');
  divider.className = 'track-nav-divider';
  wrap.appendChild(divider);

  album.tracks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row' + (i === state.track ? ' active' : '');
    row.dataset.idx = i;
    row.innerHTML = `<span class="t-num">${String(i+1).padStart(2,'0')}</span><span class="t-title">${t.title}</span><button class="row-play-btn" title="Play"><span class="icon-tri-right"></span></button>`;
    row.addEventListener('click', (e) => {
      if (e.target.closest('.row-play-btn')) return;
      selectTrack(i);
    });
    row.querySelector('.row-play-btn').addEventListener('click', () => {
      toggleOrPlay(state.album, i);
    });
    wrap.appendChild(row);
  });
  refreshPlayingIndicators();
}

function renderCover() {
  const album = ALBUMS[state.album];
  const track = state.track >= 0 ? album.tracks[state.track] : null;
  document.getElementById('coverImg').src = (track && track.image) ? track.image : album.cover;
  document.getElementById('coverEyebrow').textContent = album.label;
  document.getElementById('coverTitle').textContent = track ? track.title : album.title;
  document.getElementById('coverTagline').textContent = album.tagline;
  document.getElementById('coverStory').textContent = (track && track.story) ? track.story : '';
  const metaWrap = document.getElementById('coverMeta');
  metaWrap.innerHTML = '';
  album.meta.forEach(([label, val]) => {
    const div = document.createElement('div');
    div.innerHTML = `${label}: <span>${val}</span>`;
    metaWrap.appendChild(div);
  });
}

function renderText() {
  const album = ALBUMS[state.album];
  document.getElementById('prevBtn').disabled = (state.album === MIN_ALBUM && state.track === -1);
  document.getElementById('nextBtn').disabled = (state.album === MAX_ALBUM && state.track === album.tracks.length - 1);

  const body = document.getElementById('textBody');
  body.innerHTML = '';

  // ── ALBUM COVER VIEW ──
  if (state.track === -1) {
    document.getElementById('thNum').textContent = album.label.replace(/\/\//g, '').trim();
    document.getElementById('thTitle').textContent = album.title;
    document.getElementById('thPlayBtn').disabled = true;

    const div = document.createElement('div');
    div.className = 'album-overview';
    div.innerHTML = `
      <div class="ao-tagline">${album.tagline}</div>
      <div class="ao-meta">${album.meta.map(([k,v]) => `<div>${k}<span>${v}</span></div>`).join('')}</div>
    `;
    body.appendChild(div);
    body.scrollTop = 0;
    refreshPlayingIndicators();
    return;
  }

  // ── TRACK VIEW ──
  const track = album.tracks[state.track];
  document.getElementById('thNum').textContent = `// TRACK_${String(state.track+1).padStart(2,'0')}`;
  document.getElementById('thTitle').textContent = track.title;
  document.getElementById('thPlayBtn').disabled = false;

  track.sections.forEach(([label, text]) => {
    const sec = document.createElement('div');
    sec.className = 'lyric-section ' + sectionClass(label);
    sec.innerHTML = `<div class="sec-label">${label}</div><div class="sec-lines">${text.replace(/\n/g,'<br>')}</div>`;
    body.appendChild(sec);
  });
  body.scrollTop = 0;
  refreshPlayingIndicators();
}

/* ============ VIEW NAVIGATION (browsing — independent of playback) ============ */
function selectAlbum(num) {
  state.album = num;
  state.track = -1; // land on the album cover first, matching original behavior
  document.body.setAttribute('data-album', num);
  renderAlbumTabs();
  renderTrackNav();
  renderCover();
  renderText();
}

function selectTrack(i) {
  const album = ALBUMS[state.album];
  if (i < -1 || i >= album.tracks.length) return;
  state.track = i;
  renderTrackNav();
  renderCover();
  renderText();
  setMobileView('lyrics');
}

function stepTrack(delta) {
  const album = ALBUMS[state.album];
  let next = state.track + delta;
  if (next < -1) {
    if (state.album > MIN_ALBUM) {
      const prevAlbum = state.album - 1;
      state.album = prevAlbum;
      state.track = ALBUMS[prevAlbum].tracks.length - 1;
      document.body.setAttribute('data-album', String(prevAlbum));
      renderAlbumTabs(); renderTrackNav(); renderCover(); renderText();
    }
    return;
  }
  if (next >= album.tracks.length) {
    if (state.album < MAX_ALBUM) { selectAlbum(state.album + 1); }
    return;
  }
  selectTrack(next);
}

document.getElementById('prevBtn').addEventListener('click', () => stepTrack(-1));
document.getElementById('nextBtn').addEventListener('click', () => stepTrack(1));
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') stepTrack(1);
  if (e.key === 'ArrowLeft') stepTrack(-1);
});

/* ============ AUDIO PLAYER ENGINE (decoupled from browsing) ============ */

// Selects the track for viewing (switching album if needed) AND starts playback.
function playTrackDirect(albumNum, idx) {
  const album = ALBUMS[albumNum];
  if (idx < 0 || idx >= album.tracks.length) return;
  if (state.album !== albumNum) {
    selectAlbum(albumNum);
  }
  state.track = idx;
  renderTrackNav();
  renderCover();
  renderText();
  loadAndPlay(albumNum, idx);
}

// Same track already loaded → toggle pause/resume. Different track → start it fresh.
function toggleOrPlay(albumNum, idx) {
  if (isRowPlaying(albumNum, idx)) {
    togglePlayPause();
  } else {
    playTrackDirect(albumNum, idx);
  }
}

function loadAndPlay(albumNum, idx) {
  const album = ALBUMS[albumNum];
  const track = album.tracks[idx];
  playingAlbum = albumNum;
  playingIdx = idx;
  if (track.audio) {
    audioPlayer.src = track.audio;
    audioPlayer.play().catch(err => console.warn('Playback failed — check the file exists:', track.audio, err));
  } else {
    audioPlayer.removeAttribute('src');
    console.warn('No audio file set yet for track:', track.title);
  }
  updateMiniPlayer(albumNum, idx);
  refreshPlayingIndicators();
}

function togglePlayPause() {
  if (!audioPlayer.src) return;
  if (audioPlayer.paused) {
    audioPlayer.play().catch(err => {
      console.warn('Resume failed, retrying after reload:', err);
      const t = audioPlayer.currentTime;
      audioPlayer.load();
      audioPlayer.currentTime = t;
      audioPlayer.play().catch(err2 => console.error('Retry also failed:', err2));
    });
  } else {
    audioPlayer.pause();
  }
}

audioPlayer.addEventListener('error', () => {
  const err = audioPlayer.error;
  let msg = 'Unknown playback error';
  if (err) {
    switch (err.code) {
      case err.MEDIA_ERR_ABORTED: msg = 'Playback aborted'; break;
      case err.MEDIA_ERR_NETWORK: msg = 'Network error while loading audio'; break;
      case err.MEDIA_ERR_DECODE: msg = 'File could not be decoded (corrupt or unsupported encoding)'; break;
      case err.MEDIA_ERR_SRC_NOT_SUPPORTED: msg = 'File not found or format not supported'; break;
    }
  }
  console.error('Audio error on', audioPlayer.src, '—', msg);
  refreshPlayingIndicators();
});

// Autoplay: rolls from track to track, then album to album.
function playNextGlobal() {
  if (playingAlbum === null) return;
  const album = ALBUMS[playingAlbum];
  if (playingIdx + 1 < album.tracks.length) {
    playTrackDirect(playingAlbum, playingIdx + 1);
  } else if (playingAlbum < MAX_ALBUM) {
    playTrackDirect(playingAlbum + 1, 0);
  }
}

function playPrevGlobal() {
  if (playingAlbum === null) return;
  if (playingIdx - 1 >= 0) {
    playTrackDirect(playingAlbum, playingIdx - 1);
  } else if (playingAlbum > MIN_ALBUM) {
    const prevAlbum = ALBUMS[playingAlbum - 1];
    playTrackDirect(playingAlbum - 1, prevAlbum.tracks.length - 1);
  }
}

function updateMiniPlayer(albumNum, idx) {
  const album = ALBUMS[albumNum];
  const t = album.tracks[idx];
  document.getElementById('mpTitle').textContent = t.title;
  document.getElementById('mpAlbum').textContent = album.title.toUpperCase() + ' — TRACK ' + String(idx+1).padStart(2,'0');
  document.getElementById('miniPlayer').classList.add('active');
}

function refreshPlayingIndicators() {
  document.querySelectorAll('.track-row').forEach(row => {
    const idx = parseInt(row.dataset.idx, 10);
    const btn = row.querySelector('.row-play-btn span');
    const isThis = isRowPlaying(state.album, idx);
    const nowPlaying = isThis && !audioPlayer.paused && audioPlayer.src;
    row.classList.toggle('playing', nowPlaying);
    if (btn) btn.className = nowPlaying ? 'icon-pause' : 'icon-tri-right';
    if (nowPlaying) row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  const thBtn = document.getElementById('thPlayBtn');
  const thIcon = thBtn.querySelector('span');
  const isThisView = isRowPlaying(state.album, state.track);
  thIcon.className = (isThisView && !audioPlayer.paused && audioPlayer.src) ? 'icon-pause' : 'icon-tri-right';
  const mpIcon = document.getElementById('mpPlayIcon');
  mpIcon.className = (audioPlayer.src && !audioPlayer.paused) ? 'icon-pause' : 'icon-tri-right';
}

document.getElementById('thPlayBtn').addEventListener('click', () => {
  toggleOrPlay(state.album, state.track);
});
document.getElementById('mpPlayPause').addEventListener('click', togglePlayPause);
document.getElementById('mpNext').addEventListener('click', playNextGlobal);
document.getElementById('mpPrev').addEventListener('click', playPrevGlobal);
document.getElementById('mpProgress').addEventListener('input', (e) => {
  if (audioPlayer.duration) audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
});

audioPlayer.addEventListener('play', refreshPlayingIndicators);
audioPlayer.addEventListener('pause', refreshPlayingIndicators);
audioPlayer.addEventListener('ended', playNextGlobal);
audioPlayer.addEventListener('timeupdate', () => {
  const prog = document.getElementById('mpProgress');
  if (audioPlayer.duration) prog.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
  document.getElementById('mpTime').textContent = `${formatTime(audioPlayer.currentTime)} / ${formatTime(audioPlayer.duration)}`;
});

/* ============ VOLUME CONTROL ============ */
const mpMuteBtn = document.getElementById('mpMute');
const mpVolumeSlider = document.getElementById('mpVolume');
let lastVolume = 1;
audioPlayer.volume = 1;

function updateVolumeIcon() {
  if (audioPlayer.muted || audioPlayer.volume === 0) mpMuteBtn.textContent = '🔇';
  else if (audioPlayer.volume < 0.5) mpMuteBtn.textContent = '🔉';
  else mpMuteBtn.textContent = '🔊';
}

mpVolumeSlider.addEventListener('input', (e) => {
  const v = e.target.value / 100;
  audioPlayer.volume = v;
  audioPlayer.muted = false;
  if (v > 0) lastVolume = v;
  updateVolumeIcon();
});

mpMuteBtn.addEventListener('click', () => {
  if (audioPlayer.muted || audioPlayer.volume === 0) {
    audioPlayer.muted = false;
    audioPlayer.volume = lastVolume || 1;
    mpVolumeSlider.value = Math.round(audioPlayer.volume * 100);
  } else {
    lastVolume = audioPlayer.volume;
    audioPlayer.muted = true;
    mpVolumeSlider.value = 0;
  }
  updateVolumeIcon();
});

/* ============ MOBILE TAB SWITCHING ============ */
function setMobileView(view) {
  document.getElementById('appMain').setAttribute('data-view', view);
  document.querySelectorAll('.mobile-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
}
document.querySelectorAll('.mobile-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setMobileView(btn.dataset.view));
});

/* ============ SWIPE GESTURES (mobile) ============ */
const MOBILE_VIEW_ORDER = ['tracks', 'cover', 'lyrics'];
const appMainEl = document.getElementById('appMain');
let swipeStartX = 0, swipeStartY = 0, swipeTracking = false;

appMainEl.addEventListener('touchstart', (e) => {
  if (!window.matchMedia('(max-width: 980px)').matches) return;
  const t = e.touches[0];
  swipeStartX = t.clientX;
  swipeStartY = t.clientY;
  swipeTracking = true;
}, { passive: true });

appMainEl.addEventListener('touchend', (e) => {
  if (!swipeTracking) return;
  swipeTracking = false;
  if (!window.matchMedia('(max-width: 980px)').matches) return;

  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX;
  const dy = t.clientY - swipeStartY;

  // Require a mostly-horizontal swipe of meaningful distance so vertical
  // scrolling (lyrics body, track list) is never hijacked.
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;

  const current = appMainEl.getAttribute('data-view');
  const idx = MOBILE_VIEW_ORDER.indexOf(current);

  if (dx < 0 && idx < MOBILE_VIEW_ORDER.length - 1) {
    setMobileView(MOBILE_VIEW_ORDER[idx + 1]); // swipe left → next view
  } else if (dx > 0 && idx > 0) {
    setMobileView(MOBILE_VIEW_ORDER[idx - 1]); // swipe right → previous view
  }
}, { passive: true });

/* ============ INIT ============ */
renderAlbumTabs();
renderTrackNav();
renderCover();
renderText();
</script>
</body>
</html>
